<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VolvoxAI EfficientDet Lite0</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #181a1f;
      --muted: #667085;
      --line: #d8dde6;
      --panel: #f7f8fa;
      --accent: #0b6bcb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #ffffff;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    h1 {
      font-size: 16px;
      line-height: 1.2;
      margin: 0;
      font-weight: 650;
    }
    main {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) 430px;
      gap: 18px;
      padding: 18px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    select, input[type="file"], button {
      height: 34px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      padding: 0 10px;
      font: inherit;
    }
    button {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary {
      background: #fff;
      color: var(--ink);
      border-color: var(--line);
    }
    button:disabled {
      opacity: .48;
      cursor: default;
    }
    .stage {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      min-width: 0;
    }
    .viewport {
      width: 100%;
      min-height: 320px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    canvas, video {
      max-width: 100%;
      max-height: calc(100vh - 150px);
      background: #eef1f5;
    }
    video { display: none; }
    aside {
      border-left: 1px solid var(--line);
      padding-left: 18px;
      min-width: 0;
    }
    .status {
      color: var(--muted);
      min-height: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      min-width: 0;
    }
    .metric b {
      display: block;
      font-size: 18px;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .metric span { color: var(--muted); font-size: 12px; }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-variant-numeric: tabular-nums;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 7px 6px;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    th:first-child, td:first-child,
    th:nth-child(4), td:nth-child(4) { text-align: left; }
    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
    }
    .rawbox {
      color: var(--muted);
      font-size: 12px;
    }
    #out {
      position: absolute;
      left: -9999px;
      top: 0;
    }
    @media (max-width: 860px) {
      header { align-items: flex-start; flex-direction: column; }
      main { grid-template-columns: 1fr; }
      aside { border-left: 0; padding-left: 0; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <h1>VolvoxAI EfficientDet Lite0</h1>
    <div class="toolbar">
      <select id="backend" title="Backend">
        <option value="webgpu">WebGPU</option>
        <option value="wasm">WASM</option>
        <option value="cpu-js">CPU (JavaScript)</option>
      </select>
      <input id="file" type="file" accept="image/png,image/jpeg">
      <button id="camera" class="secondary">Camera</button>
      <button id="stop" class="secondary" disabled>Stop</button>
      <button id="run" disabled>Run</button>
    </div>
  </header>

  <main>
    <section class="stage">
      <div id="status" class="status">Loading model...</div>
      <div class="viewport">
        <canvas id="canvas" width="640" height="480"></canvas>
        <video id="video" autoplay playsinline muted></video>
      </div>
    </section>

    <aside>
      <div class="metrics">
        <div class="metric"><b id="metric-backend">-</b><span>backend</span></div>
        <div class="metric"><b id="metric-time">-</b><span>forward</span></div>
        <div class="metric"><b id="metric-rows">-</b><span>detections</span></div>
      </div>
      <table>
        <thead>
          <tr>
            <th>rank</th>
            <th>score</th>
            <th>class</th>
            <th>label</th>
            <th>box</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </aside>
  </main>

  <pre id="out"></pre>

  <script type="module">
    import {
      ModelLoader,
      Model,
      VolvoxAI,
    } from '../dist/0.4.0/volvoxai.js';
    import { efficientDetInputViewFromRgba } from './efficientdet_lite0/image_input.js';

    const MODEL = '../models/efficientdet_lite0_int8/model.safetensors';
    const LABELS = '../models/efficientdet_lite0_int8/labels.txt';
    const W = 320;
    const H = 320;
    const C = 90;
    const MAX_DET = 12;
    const SCORE_THRESHOLD = 0.08;
    const NMS_THRESHOLD = 0.45;

    const $ = (id) => document.getElementById(id);
    const canvas = $('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const video = $('video');
    const statusEl = $('status');
    const rowsEl = $('rows');
    const outEl = $('out');
    const backendEl = $('backend');
    const runEl = $('run');
    const cameraEl = $('camera');
    const stopEl = $('stop');
    const metricBackend = $('metric-backend');
    const metricTime = $('metric-time');
    const metricRows = $('metric-rows');

    const inputCanvas = document.createElement('canvas');
    inputCanvas.width = W;
    inputCanvas.height = H;
    const inputCtx = inputCanvas.getContext('2d', { willReadFrequently: true });

    let runtime = null;
    let compiled = null;
    let context = null;
    let snapshot = null;
    let inputTensor = null;
    let labels = [];
    let anchors = [];
    let hasFrame = false;
    let live = false;
    let sourceKind = 'empty';
    let sourceImage = null;
    let lastDetections = [];
    let lastForwardMs = 0;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function fail(err) {
      console.error(err);
      setStatus(`ERROR ${err.message}`);
      outEl.textContent = `FATAL ${err.message}`;
      stopLive();
    }

    function clamp01(v) {
      return Math.max(0, Math.min(1, v));
    }

    function clearCanvas() {
      canvas.width = 640;
      canvas.height = 480;
      ctx.fillStyle = '#eef1f5';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#667085';
      ctx.font = '16px system-ui, sans-serif';
      ctx.fillText('Choose an image or start the camera', 24, 36);
    }

    function buildAnchors() {
      const out = [];
      const strides = [8, 16, 32, 64, 128];
      const ratios = [1, 2, 0.5];
      const scales = [1, Math.pow(2, 1 / 3), Math.pow(2, 2 / 3)];
      for (const stride of strides) {
        const fh = Math.ceil(H / stride);
        const fw = Math.ceil(W / stride);
        for (let y = 0; y < fh; y++) {
          for (let x = 0; x < fw; x++) {
            const cy = (y + 0.5) * stride / H;
            const cx = (x + 0.5) * stride / W;
            for (const scale of scales) {
              for (const ratio of ratios) {
                const size = 4 * stride * scale;
                const sr = Math.sqrt(ratio);
                out.push({ y: cy, x: cx, h: size / sr / H, w: size * sr / W });
              }
            }
          }
        }
      }
      return out;
    }

    async function loadBackend() {
      stopLive();
      const backend = backendEl.value;
      runEl.disabled = true;
      setStatus(`Loading ${backend} backend...`);
      await context?.close();
      await compiled?.close();
      await runtime?.close();
      context = null;
      compiled = null;
      runtime = await VolvoxAI.createRuntime({
        backends: [backend],
        wasmUrl: '../dist/0.4.0/volvoxai.wasm',
      });
      setStatus('Loading logical package...');
      snapshot = Model.capture(
        await ModelLoader.load(MODEL),
      );
      const logicalInput = snapshot.graph.inputs.input0;
      if (!logicalInput) throw new Error('model is missing image input tensor input0');
      inputTensor = {
        ...logicalInput,
        quantization: snapshot.quantizationByTensor.input0,
      };
      compiled = await runtime.compile(snapshot, {
        backend: { mode: 'require', backend, operatorFallback: 'forbid' },
      });
      context = await compiled.createContext();
      metricBackend.textContent = compiled.backend;
      runEl.disabled = !hasFrame;
      setStatus('Ready');
    }

    async function loadLabels() {
      const res = await fetch(LABELS);
      if (!res.ok) throw new Error(`labels.txt ${res.status}`);
      labels = (await res.text()).split(/\r?\n/).map((s) => s.trim());
    }

    function sourceSize() {
      if (sourceKind === 'camera') return [video.videoWidth || 640, video.videoHeight || 480];
      if (sourceKind === 'image' && sourceImage) return [sourceImage.naturalWidth || sourceImage.width, sourceImage.naturalHeight || sourceImage.height];
      return [W, H];
    }

    function drawSource(detections = lastDetections) {
      const [sw, sh] = sourceSize();
      const width = Math.min(960, Math.max(320, sw || 640));
      const height = Math.round(width * ((sh || 480) / (sw || 640)));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      if (sourceKind === 'camera' && video.readyState >= 2) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      } else if (sourceKind === 'image' && sourceImage) {
        ctx.drawImage(sourceImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      drawDetections(detections);
    }

    function drawDetections(detections) {
      ctx.lineWidth = Math.max(2, Math.round(canvas.width / 320));
      ctx.font = `${Math.max(12, Math.round(canvas.width / 48))}px system-ui, sans-serif`;
      for (const d of detections) {
        const x = d.xmin * canvas.width;
        const y = d.ymin * canvas.height;
        const w = (d.xmax - d.xmin) * canvas.width;
        const h = (d.ymax - d.ymin) * canvas.height;
        if (w < 2 || h < 2) continue;
        ctx.strokeStyle = '#00d084';
        ctx.strokeRect(x, y, w, h);
        const text = `${d.label} ${(d.score * 100).toFixed(0)}%`;
        const tw = ctx.measureText(text).width + 10;
        const th = Math.max(18, Math.round(canvas.width / 32));
        ctx.fillStyle = 'rgba(0, 0, 0, .72)';
        ctx.fillRect(x, Math.max(0, y - th), tw, th);
        ctx.fillStyle = '#fff';
        ctx.fillText(text, x + 5, Math.max(13, y - 5));
      }
    }

    function tensorFromSource() {
      if (sourceKind === 'camera' && video.readyState >= 2) {
        inputCtx.drawImage(video, 0, 0, W, H);
      } else if (sourceKind === 'image' && sourceImage) {
        inputCtx.drawImage(sourceImage, 0, 0, W, H);
      } else {
        inputCtx.fillStyle = '#000';
        inputCtx.fillRect(0, 0, W, H);
      }
      const rgba = inputCtx.getImageData(0, 0, W, H).data;
      return efficientDetInputViewFromRgba(rgba, inputTensor);
    }

    function decodeBox(raw, index) {
      const a = anchors[index];
      if (!a) return null;
      const yCenter = raw[0] / 10 * a.h + a.y;
      const xCenter = raw[1] / 10 * a.w + a.x;
      const bh = Math.exp(Math.max(-6, Math.min(6, raw[2] / 5))) * a.h;
      const bw = Math.exp(Math.max(-6, Math.min(6, raw[3] / 5))) * a.w;
      const ymin = clamp01(yCenter - bh / 2);
      const xmin = clamp01(xCenter - bw / 2);
      const ymax = clamp01(yCenter + bh / 2);
      const xmax = clamp01(xCenter + bw / 2);
      if (xmax <= xmin || ymax <= ymin) return null;
      return { ymin, xmin, ymax, xmax };
    }

    function iou(a, b) {
      const x0 = Math.max(a.xmin, b.xmin);
      const y0 = Math.max(a.ymin, b.ymin);
      const x1 = Math.min(a.xmax, b.xmax);
      const y1 = Math.min(a.ymax, b.ymax);
      const iw = Math.max(0, x1 - x0);
      const ih = Math.max(0, y1 - y0);
      const inter = iw * ih;
      const aa = (a.xmax - a.xmin) * (a.ymax - a.ymin);
      const ba = (b.xmax - b.xmin) * (b.ymax - b.ymin);
      return inter / Math.max(1e-9, aa + ba - inter);
    }

    function decodeDetections(scores, boxes) {
      const dets = Math.min(Math.floor(boxes.length / 4), anchors.length);
      const candidates = [];
      const fallback = [];
      for (let d = 0; d < dets; d++) {
        let cls = -1;
        let score = -Infinity;
        const base = d * C;
        for (let c = 0; c < C; c++) {
          const label = labels[c] || '';
          if (!label || label === '???') continue;
          const v = scores[base + c];
          if (v > score) {
            score = v;
            cls = c;
          }
        }
        if (cls < 0) continue;
        const box = decodeBox(boxes.subarray(d * 4, d * 4 + 4), d);
        if (!box) continue;
        const det = { index: d, score, cls, label: labels[cls] || String(cls), ...box };
        if (score >= SCORE_THRESHOLD) candidates.push(det);
        fallback.push(det);
      }
      const pool = candidates.length ? candidates : fallback;
      pool.sort((a, b) => b.score - a.score);
      const selected = [];
      for (const cand of pool.slice(0, 300)) {
        let keep = true;
        for (const picked of selected) {
          if (cand.cls === picked.cls && iou(cand, picked) > NMS_THRESHOLD) {
            keep = false;
            break;
          }
        }
        if (keep) selected.push(cand);
        if (selected.length >= MAX_DET) break;
      }
      return selected;
    }

    function renderRows(rows) {
      rowsEl.innerHTML = '';
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i];
        const tr = document.createElement('tr');
        const box = [r.xmin, r.ymin, r.xmax, r.ymax].map((v) => Number(v).toFixed(3)).join(', ');
        tr.innerHTML = `
          <td>${i + 1}</td>
          <td>${r.score.toFixed(4)}</td>
          <td>${r.cls}</td>
          <td title="${r.label}">${r.label}</td>
          <td class="rawbox" title="${box}">${box}</td>
        `;
        rowsEl.appendChild(tr);
      }
    }

    async function runOnce() {
      if (!context || !hasFrame) return [];
      const input0 = tensorFromSource();
      const t0 = performance.now();
      const result = await context.execute({ input0 });
      let scores;
      let boxes;
      try {
        [scores, boxes] = await Promise.all([
          result.output('scores').read(),
          result.output('boxes').read(),
        ]);
      } finally {
        await result.close();
      }
      lastForwardMs = performance.now() - t0;
      lastDetections = decodeDetections(scores, boxes);
      renderRows(lastDetections);
      metricTime.textContent = `${lastForwardMs.toFixed(0)} ms`;
      metricRows.textContent = String(lastDetections.length);
      outEl.textContent = `DONE backend=${metricBackend.textContent} ms=${lastForwardMs.toFixed(2)} rows=${lastDetections.length}\n` +
        lastDetections.map((r, i) => `${i + 1}\t${r.index}\t${r.score.toFixed(6)}\t${r.cls}\t${r.label}`).join('\n');
      return lastDetections;
    }

    async function runStatic() {
      if (!context || !hasFrame) return;
      runEl.disabled = true;
      setStatus('Running...');
      await runOnce();
      drawSource();
      setStatus('Done');
      runEl.disabled = false;
    }

    async function inferenceLoop() {
      while (live) {
        if (context && video.readyState >= 2) {
          try {
            await runOnce();
            setStatus(`Live ${lastForwardMs.toFixed(0)} ms`);
          } catch (err) {
            fail(err);
            return;
          }
        }
        await new Promise((resolve) => setTimeout(resolve, 10));
      }
    }

    function renderLoop() {
      if (!live) return;
      drawSource();
      requestAnimationFrame(renderLoop);
    }

    function startLive() {
      if (live) return;
      live = true;
      stopEl.disabled = false;
      runEl.disabled = true;
      renderLoop();
      inferenceLoop();
    }

    function stopLive() {
      live = false;
      stopEl.disabled = true;
      runEl.disabled = !hasFrame;
      const stream = video.srcObject;
      if (stream) {
        for (const track of stream.getTracks()) track.stop();
        video.srcObject = null;
      }
    }

    $('file').addEventListener('change', (ev) => {
      stopLive();
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        sourceImage = img;
        sourceKind = 'image';
        hasFrame = true;
        lastDetections = [];
        drawSource();
        runEl.disabled = !context;
        setStatus('Ready');
      };
      img.onerror = () => fail(new Error('image decode failed'));
      img.src = url;
    });

    function loadImageUrl(url) {
      return new Promise((resolve, reject) => {
        stopLive();
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          sourceImage = img;
          sourceKind = 'image';
          hasFrame = true;
          lastDetections = [];
          drawSource();
          runEl.disabled = !context;
          setStatus('Ready');
          resolve();
        };
        img.onerror = () => reject(new Error('image decode failed'));
        img.src = url;
      });
    }

    cameraEl.addEventListener('click', () => {
      stopLive();
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
        .then((stream) => {
          video.srcObject = stream;
          sourceKind = 'camera';
          sourceImage = null;
          hasFrame = true;
          lastDetections = [];
          runEl.disabled = true;
          setStatus('Camera starting...');
          video.onloadedmetadata = () => {
            video.play();
            startLive();
          };
        })
        .catch(fail);
    });

    stopEl.addEventListener('click', () => {
      stopLive();
      setStatus('Stopped');
    });

    runEl.addEventListener('click', () => runStatic().catch(fail));
    backendEl.addEventListener('change', () => loadBackend().catch(fail));
    window.addEventListener('pagehide', () => {
      void (async () => {
        await context?.close();
        await compiled?.close();
        await runtime?.close();
      })();
    }, { once: true });

    async function main() {
      clearCanvas();
      anchors = buildAnchors();
      await loadLabels();
      await loadBackend();
      const q = new URLSearchParams(location.search);
      if (q.get('image')) {
        await loadImageUrl(q.get('image'));
        await runStatic();
      } else if (q.get('autorun') === 'zero') {
        sourceKind = 'zero';
        hasFrame = true;
        await runStatic();
      }
    }

    main().catch(fail);
  </script>
</body>
</html>
