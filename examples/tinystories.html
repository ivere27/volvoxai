<!doctype html>
<html>
<head><meta charset="utf-8"><title>Volvox · TinyStories in the browser</title>
<style>body{font:15px/1.5 system-ui;margin:2rem;max-width:48rem}#story{white-space:pre-wrap;background:#f4f4f4;padding:1rem;border-radius:8px;min-height:4rem}.muted{color:#666}</style>
</head>
<body>
<h2>Volvox · TinyStories-1M in the browser</h2>
<div id="status" class="muted">loading…</div>
<p><b>Backend:</b> <span id="backend">?</span> &nbsp; <b>tok/s:</b> <span id="tps">?</span></p>
<div id="story"></div>
<pre id="out" style="position:absolute;left:-9999px"></pre>
    <script type="module">
    import { Graph, GraphLoader, Tokenizer, VolvoxAI } from '../dist/0.3.0/volvoxai.js';

const q = new URLSearchParams(location.search);
    const backend = q.get('backend') || 'wasm';          // webgpu | wasm | cpu
    const prompt = q.get('prompt') || 'Once upon a time, Lily';
    const nNew = parseInt(q.get('n') || '32', 10);
    const MODEL = '../models/tinystories_1m/model.safetensors';
    const VOCAB = '../models/tinystories_1m/vocab.bin';
    const MERGES = '../models/tinystories_1m/merges.txt';
    const SEQ = 256, VOCAB_SIZE = 50257, EOS = 50256;

const statusEl = document.getElementById('status');
const storyEl = document.getElementById('story');
const outEl = document.getElementById('out');          // machine-readable (for CDP)
const setStatus = (s) => { statusEl.textContent = s; };
const fail = (e) => { setStatus('ERROR ' + e.message); outEl.textContent = 'FATAL ' + e.message; console.error(e); };

    async function main() {
      setStatus(`init(${backend})…`);
      const runtime = await VolvoxAI.createRuntime({
        backends: [backend],
        wasmUrl: '../dist/0.3.0/volvoxai.wasm',
      });
      let model;
      let compiled;
      let context;
      try {

      setStatus('loading tokenizer…');
      const tokenizer = new Tokenizer();
      await tokenizer.load(VOCAB, MERGES);

  setStatus('loading model…');
  const graph = new Graph();
  await GraphLoader.load(graph, MODEL);
  model = runtime.createModel(graph);
  compiled = await model.compile({
    backend: { mode: 'require', backend, operatorFallback: 'forbid' },
  });
  context = await compiled.createContext();
  const usedBackend = compiled.backend;
  document.getElementById('backend').textContent = usedBackend;
  const outName = graph.outputNames[graph.outputNames.length - 1];

  // inputs: tokens/positions as float ids (the f32 shaders/kernels read + truncate them)
  const tokens = new Float32Array(SEQ);
  const positions = new Float32Array(SEQ);
  for (let i = 0; i < SEQ; i++) positions[i] = i;
      const ids = tokenizer.encode(prompt, SEQ);
      for (let i = 0; i < SEQ; i++) tokens[i] = i < ids.length ? ids[i] : EOS;
      let last = ids.length - 1;

  const outIds = [];
  const argmaxRow = (logits, row) => { let b = 0, bv = -1e30; const o = row * VOCAB_SIZE; for (let i = 0; i < VOCAB_SIZE; i++) if (logits[o + i] > bv) { bv = logits[o + i]; b = i; } return b; };

      setStatus('generating…');
      storyEl.textContent = prompt;
      const t0 = performance.now();
      for (let step = 0; step < nNew && last < SEQ - 1; step++) {
        const result = await context.execute({ tokens, positions });
        let logits;
        try {
          logits = await result.output(outName).read();
        } finally {
          await result.close();
        }
        const best = argmaxRow(logits, last);
        outIds.push(best);
        last++; tokens[last] = best;
        storyEl.textContent = prompt + tokenizer.decode(outIds);
      }
  const dt = (performance.now() - t0) / 1000;
  document.getElementById('tps').textContent = (nNew / dt).toFixed(1);
  const text = storyEl.textContent;
  setStatus(`done (${usedBackend}, ${dt.toFixed(1)}s)`);
  outEl.textContent = `DONE backend=${usedBackend} tps=${(nNew / dt).toFixed(2)}\n` + text;
      } finally {
        await context?.close();
        await compiled?.close();
        await model?.close();
        await runtime.close();
      }
}
main().catch(fail);
</script>
</body>
</html>
