// Tensor affine metadata uses the same document vocabulary in every planner.
enum TensorQuantizationKind {
  TENSOR_QUANTIZATION_KIND_NONE = 0;
  TENSOR_QUANTIZATION_KIND_PER_TENSOR = 1;
  TENSOR_QUANTIZATION_KIND_PER_AXIS = 2;
}

enum NodeParameterProfile {
  NODE_PARAMETER_PROFILE_UNSPECIFIED = 0;
  NODE_PARAMETER_PROFILE_INFERENCE = 1;
  NODE_PARAMETER_PROFILE_FULL = 2;
}

message ParameterDefinition {
  NodeParameterKey key = 1;
  string json_name = 2;
  NodeParameterJsonForm json_form = 3;
  NodeParameterProfile profile = 4;
}

message ParameterSymbolDefinition {
  NodeParameterSymbol symbol = 1;
  string json_value = 2;
}

message OperatorParameterContract {
  volvoxai.operator_vocabulary.OperatorKind operator = 1;
  repeated NodeParameterKey key = 2;
  repeated NodeParameterKey full_key = 3;
  repeated NodeParameterKey nullable_key = 4;
}

// All members in one group are mutually exclusive for each listed operator.
message ParameterAliasGroup {
  string id = 1;
  NodeParameterProfile profile = 2;
  repeated volvoxai.operator_vocabulary.OperatorKind operator = 3;
  repeated NodeParameterKey key = 4;
}

message OperatorParameterRegistry {
  uint32 schema_version = 1;
  repeated ParameterDefinition parameter = 2;
  repeated ParameterSymbolDefinition symbol = 3;
  repeated OperatorParameterContract operator = 4;
  repeated volvoxai.operator_vocabulary.OperatorKind parameter_free_operator = 5;
  repeated ParameterAliasGroup alias_group = 6;
}

extend google.protobuf.FileOptions {
  OperatorParameterRegistry registry = 53001;
}

