// Internal VolvoxAI operator-parameter vocabulary.
//
// This registry is not part of the public Synurang FFI. Graph documents keep
// their string-keyed params object; generated dependency-free projections map
// those strings to a fixed typed cache while loading/compiling a graph. Runtime
// execution never parses protobuf. Semantic range, shape, and cross-field
// validation remains handwritten in the language-specific shape contracts.

syntax = "proto3";

package volvoxai.operator_param_registry;

import "google/protobuf/descriptor.proto";
import "operator_vocabulary.proto";

// Dense internal cache indices. These values intentionally preserve the
// current native VxNodeParamKey numbering, including AXIS at zero. They are not
// serialized in volvox-graph/v1 or exposed by the public native ABI.
