// Internal VolvoxAI kernel inventory.
//
// This is an implementation-composition contract, not part of the public
// Synurang FFI declared by volvoxai.proto.  The file option at the bottom is
// the single authored inventory.  tools/generate_kernel_registry.py validates
// it and emits dependency-free TypeScript, Python, native C, and Markdown
// views.  Runtime registration and exporter qualification are intentionally
// independent: a dynamically checked/fallback-capable runtime route is not
// evidence for a strict exporter target.

syntax = "proto3";

package volvoxai.kernel_registry;

import "google/protobuf/descriptor.proto";
import "operator_vocabulary.proto";

enum BackendKind {
  BACKEND_KIND_UNSPECIFIED = 0;
  reserved 1;
  BACKEND_KIND_WASM = 2;
  BACKEND_KIND_WEBGPU = 3;
  BACKEND_KIND_NATIVE_CPU = 4;
  BACKEND_KIND_VULKAN = 5;
  BACKEND_KIND_OPENGL = 6;
  BACKEND_KIND_METAL = 7;
  BACKEND_KIND_CUDA = 8;
}

enum KernelProfile {
  KERNEL_PROFILE_UNSPECIFIED = 0;
  KERNEL_PROFILE_INFERENCE = 1;
  KERNEL_PROFILE_FULL = 2;
}

enum KernelPhase {
  KERNEL_PHASE_UNSPECIFIED = 0;
  KERNEL_PHASE_FORWARD = 1;
  KERNEL_PHASE_BACKWARD = 2;
  KERNEL_PHASE_OPTIMIZER = 3;
  KERNEL_PHASE_PTQ = 4;
}

// DIRECT means the backend owns a route for the operator, subject to the
// route's predicate. DYNAMIC means an imperative backend dispatcher must make
// the final choice and may decline so runtime fallback can continue.
enum RuntimeSupportMode {
  RUNTIME_SUPPORT_MODE_UNSPECIFIED = 0;
  RUNTIME_SUPPORT_MODE_DIRECT = 1;
  RUNTIME_SUPPORT_MODE_DYNAMIC = 2;
}

// CANONICAL selects the authoritative contract for the current implementation
// tranche; it is not an attestation of cross-language, backend, or release-gate
// coverage. DEFERRED reserves a stable route for a later tranche.
// BOUNDED_VALUE_DEPENDENT marks the fixed-capacity plus valid-count/padding
// convention; compact data-dependent cardinality remains outside v1.
enum ShapeContractClassification {
  SHAPE_CONTRACT_CLASSIFICATION_UNSPECIFIED = 0;
  SHAPE_CONTRACT_CLASSIFICATION_CANONICAL = 1;
  SHAPE_CONTRACT_CLASSIFICATION_DEFERRED = 2;
  SHAPE_CONTRACT_CLASSIFICATION_BOUNDED_VALUE_DEPENDENT = 3;
}

message OperatorRoute {
  volvoxai.operator_vocabulary.OperatorKind operator = 1;
  string route = 2;
  string predicate_id = 3;
}

message OperatorSet {
  string name = 1;
  repeated volvoxai.operator_vocabulary.OperatorKind operator = 2;
}

message OperatorShapeContractRoute {
  volvoxai.operator_vocabulary.OperatorKind operator = 1;
  string shape_function_id = 2;
  ShapeContractClassification classification = 3;
}

message BackendInventory {
  BackendKind kind = 1;
  string runtime_id = 2;
  // Public provider spelling; separate from exporter/registry target IDs.
  string provider_name = 12;
  string exporter_target = 3;
  RuntimeSupportMode support_mode = 4;
  string default_route = 5;
  string default_predicate_id = 6;

  // Named sets keep the authored inventory normalized. The generator expands
  // them and rejects unknown set names or duplicate expanded operators.
  repeated string runtime_operator_set = 10;
  repeated string exporter_qualified_operator_set = 11;

  // Runtime registration says that the backend recognizes this operator and
  // has a route candidate. It does not waive dtype/shape/device predicates.
  repeated volvoxai.operator_vocabulary.OperatorKind runtime_operator = 7;
  repeated OperatorRoute route = 8;

  // Strict, correctness-tested, no-fallback exporter qualification. Empty is
  // meaningful and must remain distinct from runtime_operator.
  repeated volvoxai.operator_vocabulary.OperatorKind exporter_qualified_operator = 9;
}

message TargetProfile {
  string name = 1;
  repeated string member_target = 2;
}

// A logical route may select multiple physical variants. Variants name actual
// symbols/shaders/exports and the device or descriptor predicates guarding
// them. The runtime may keep the selection code imperative while migrating,
// but every variant documented as canonical belongs here.
message KernelVariant {
  string id = 1;
  BackendKind backend = 2;
  repeated volvoxai.operator_vocabulary.OperatorKind operator = 3;
  KernelProfile profile = 4;
  KernelPhase phase = 5;
  string entrypoint_id = 6;
  string predicate_id = 7;
  repeated string required_feature = 8;
  int32 priority = 9;
}

message KernelRegistry {
  uint32 schema_version = 1;
  repeated BackendInventory backend = 2;
  repeated TargetProfile target_profile = 3;
  repeated KernelVariant variant = 4;
  repeated OperatorSet operator_set = 5;
  repeated OperatorShapeContractRoute shape_contract = 6;
}

extend google.protobuf.FileOptions {
  KernelRegistry registry = 51001;
}

