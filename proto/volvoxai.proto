// VolvoxAI lifecycle contract for the in-process Synurang protobuf FFI.
//
// Handles mirror the public native ownership model. A child retains the native
// parent objects needed for its lifetime, so callers may release parent handles
// after creating a child. The plugin is a full-profile composition: inference
// uses Runtime/Model/CompiledModel/ExecutionContext/Result, while training uses
// one retained Trainer with private state and explicit publication. Tensor
// payloads are little-endian and row-major.

syntax = "proto3";

package volvoxai.runtime;

option go_package = "github.com/ivere27/volvoxai/go/runtime";
option java_package = "io.github.ivere27.volvoxai.runtime";
option java_multiple_files = true;

service RuntimeService {
  rpc CreateRuntime(CreateRuntimeRequest) returns (RuntimeHandle);
  rpc CloseRuntime(RuntimeRef) returns (OperationReport);
  rpc ReleaseRuntime(RuntimeRef) returns (Empty);

  rpc LoadModel(LoadModelRequest) returns (ModelHandle);
  rpc GetModelRevision(ModelRef) returns (RevisionInfo);
  rpc PublishAdapter(PublishAdapterRequest) returns (AdapterRevision);
  rpc ReleaseModel(ModelRef) returns (Empty);

  rpc CreateTrainer(CreateTrainerRequest) returns (TrainerHandle);
  rpc CloseTrainer(TrainerRef) returns (OperationReport);
  rpc ReleaseTrainer(TrainerRef) returns (Empty);
  rpc TrainStep(TrainStepRequest) returns (TrainStepResult);
  rpc CommitTrainer(TrainerRef) returns (RevisionInfo);
  rpc RollbackTrainer(TrainerRef) returns (OperationReport);
  rpc ExportTrainerWeights(ExportTrainerWeightsRequest)
      returns (OperationReport);

  rpc CreatePtqPlan(CreatePtqPlanRequest) returns (PtqPlanHandle);
  rpc ClosePtqPlan(PtqPlanRef) returns (OperationReport);
  rpc ReleasePtqPlan(PtqPlanRef) returns (Empty);
  rpc CalibratePtqPlan(CalibratePtqPlanRequest)
      returns (PtqCalibrationInfo);
  rpc InspectPtqPlan(PtqPlanRef) returns (PtqPlanInfo);
  rpc WritePtqPackage(WritePtqPackageRequest) returns (PtqPackageInfo);

  rpc CompileModel(CompileModelRequest) returns (CompiledModelHandle);
  rpc GetCompiledModelReport(CompiledModelRef) returns (OperationReport);
  rpc ReleaseCompiledModel(CompiledModelRef) returns (Empty);

  rpc CreateExecutionContext(CreateExecutionContextRequest)
      returns (ExecutionContextHandle);
  rpc CloseExecutionContext(ExecutionContextRef) returns (OperationReport);
  rpc ReleaseExecutionContext(ExecutionContextRef) returns (Empty);
  rpc Execute(ExecuteRequest) returns (ExecutionResultHandle);
  rpc DecodeSeed(DecodeSeedRequest) returns (ExecutionResultHandle);
  rpc DecodeStep(DecodeStepRequest) returns (ExecutionResultHandle);
  rpc ResetDecode(ExecutionContextRef) returns (OperationReport);
  rpc SelectAdapter(SelectAdapterRequest) returns (OperationReport);
  rpc RebindAdapter(ExecutionContextRef) returns (OperationReport);

  rpc GetResult(ResultRef) returns (ResultInfo);
  rpc ReadOutput(ReadOutputRequest) returns (Tensor);
  rpc ReleaseResult(ResultRef) returns (Empty);
}

message Empty {}

// Canonical tensor element/storage vocabulary. Enum membership describes a
// representation, not execution support: each operation validates the subset
// it can execute. Keep existing numbers stable and append future dtypes.
enum DataType {
  DATA_TYPE_UNSPECIFIED = 0;

  DATA_TYPE_BOOL = 1;
  DATA_TYPE_F4 = 2;
  DATA_TYPE_F6_E2M3 = 3;
  DATA_TYPE_F6_E3M2 = 4;
  DATA_TYPE_U8 = 5;
  DATA_TYPE_I8 = 6;
  DATA_TYPE_F8_E5M2 = 7;
  DATA_TYPE_F8_E4M3 = 8;
  DATA_TYPE_F8_E8M0 = 9;
  DATA_TYPE_F8_E4M3FNUZ = 10;
  DATA_TYPE_F8_E5M2FNUZ = 11;
  DATA_TYPE_I16 = 12;
  DATA_TYPE_U16 = 13;
  DATA_TYPE_F16 = 14;
  DATA_TYPE_BF16 = 15;
  DATA_TYPE_I32 = 16;
  DATA_TYPE_U32 = 17;
  DATA_TYPE_F32 = 18;
  DATA_TYPE_C64 = 19;
  DATA_TYPE_F64 = 20;
  DATA_TYPE_I64 = 21;
  DATA_TYPE_U64 = 22;
}

enum MemoryLocation {
  MEMORY_LOCATION_HOST = 0;
  MEMORY_LOCATION_DEVICE = 1;
}

enum BackendPolicyMode {
  BACKEND_POLICY_MODE_PREFER = 0;
  BACKEND_POLICY_MODE_REQUIRE = 1;
}

enum OperatorFallback {
  OPERATOR_FALLBACK_ALLOW = 0;
  OPERATOR_FALLBACK_FORBID = 1;
}

enum DecodeRowMode {
  DECODE_ROW_MODE_DISABLED = 0;
  DECODE_ROW_MODE_AUTO = 1;
  DECODE_ROW_MODE_REQUIRED = 2;
}

// Runtime dispatch ownership. DIRECT bypasses Runtime scheduling while
// SCHEDULED enters the Runtime's bounded coordinator.
enum ExecutionMode {
  EXECUTION_MODE_DIRECT = 0;
  EXECUTION_MODE_SCHEDULED = 1;
}

enum TrainingOptimizerKind {
  TRAINING_OPTIMIZER_KIND_ADAMW = 0;
  TRAINING_OPTIMIZER_KIND_SGD = 1;
}

// The full native authoring profile currently emits physical W8A8
// QLinear/QConv2D packages. Other precision modes are deliberately absent
