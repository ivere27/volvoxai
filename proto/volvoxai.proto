// VolvoxAI Protocol Contract
//
// This file is the single source of truth for VolvoxAI's public API.
// The tracked TypeScript, C, and Python projections expose only the services
// and messages defined here. There is no second public API. Handwritten
// headers and SDK classes are not permitted to declare operations that do not
// appear in this file. A future language projection must be generated from
// this schema before it is a supported host.
//
// ─── Design principles ───
//
// 1. One API definition, many projections.
//    Native C embedders link a source-built VolvoxAI profile and use generated
//    service/message entry points. The generated Python client can load that
//    library through Synurang's unary FFI. Web hosts use generated TypeScript
//    clients against an in-process engine host backed by the same portable C
//    kernels compiled to WASM. The fixed release currently installs neither a
//    native embedding library nor generated C headers.
//
// 2. Handles are plain int64, always the first field.
//    An id names one retained engine object. A child retains the parents it
//    needs, so a caller may release a parent id after creating a child.
//    Release is idempotent; a released id fails closed with HANDLE_DISPOSED.
//    Ids are monotonically issued and never reused within a process.
//
// 3. Tensor transport is explicit.
//    Inline bytes work on every host. An IN_PROCESS host also accepts
//    BufferView for caller-owned memory; a REMOTE host rejects it. See
//    TransportProfile and BufferView.
//
// 4. Presence-sensitive options use `optional`.
//    Absence takes the documented default. Ordinary proto3 scalar fields use
//    their zero value directly, so callers do not need a second defaulting
//    convention.
//
// 5. Every reported operation returns typed evidence.
//    OperationReport carries status, lineage, timings, backend routing proof,
//    and optional memory evidence. Evidence is typed — never a packed string
//    that consumers must parse.
//
// 6. Every RPC is unary.
//    Runtime, context, request, and result handles already carry long-lived
//    state; each RPC performs one explicit state transition with one typed
//    result. Large in-process payloads use BufferView rather than a stream,
//    and asynchronous waits use VxSchedulerService.WaitRequest. Synurang supports
//    streams, but this lifecycle currently has no operation whose semantics
//    require one.
//
// 7. Profiles are visible in the contract.
//    VxPlatformService, VxInferenceService, and VxPlanningService exist in
//    every build. VxSchedulerService is the serving composition.
//    VxTrainingService and VxQuantizationService are full-profile authoring
//    only. An inference build does not carry unimplemented training RPCs.
//
// ─── Tensor conventions ───
//
// Payloads are little-endian and row-major. Input payloads are caller-owned
// host memory. Handlers exact-match the named descriptor's shape, dtype, and
// byte size before the engine copies. DataType is the canonical storage
// vocabulary; enum membership describes a representation, not execution
// support. Each operation validates the subset it can execute.

syntax = "proto3";

package volvoxai.v1;

option go_package = "github.com/ivere27/volvoxai/go/api/v1";
option java_package = "io.github.ivere27.volvoxai.v1";
option java_multiple_files = true;

// ═══════════════════════════════════════════════════════════
// Services
// ═══════════════════════════════════════════════════════════

// Process-scoped, handle-free diagnostics. Present in every build profile.
service VxPlatformService {
  // @api {"effect":"READ_ONLY"}
  rpc GetPlatformInfo(Empty) returns (PlatformInfo);
  // Discover the methods available in this build and their schema contracts.
  // @api {"effect":"READ_ONLY"}
  rpc DescribeApi(DescribeApiRequest) returns (ApiDescription);
  // @api {"effect":"READ_ONLY"}
  rpc SampleProcessMemory(Empty) returns (ProcessMemorySample);
  // @api {"effect":"READ_ONLY"}
  rpc GetMonotonicTime(Empty) returns (MonotonicTime);
  // @api {"effect":"READ_ONLY"}
  rpc DescribeStatus(DescribeStatusRequest) returns (StatusDescription);
}

// Immutable, CPU-resident text processing. Present in both profiles. Creating
// or using a tokenizer never acquires a GPU device.
service VxTextService {
  // @api {"effect":"CREATE"}
  rpc CreateTokenizer(CreateTokenizerRequest) returns (TokenizerHandle);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["tokenizer_id"]}]}
  rpc EncodeText(EncodeTextRequest) returns (EncodedText);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["tokenizer_id"]}]}
  rpc DecodeTokens(DecodeTokensRequest) returns (DecodedText);
  // @api {"effect":"RELEASE"}
  rpc ReleaseTokenizer(TokenizerRef) returns (OperationReport);
}

message VocabularyToken {
  uint32 id = 1;
  bytes value = 2;
}
message TokenizerVocabulary { repeated VocabularyToken tokens = 1; }
message CreateTokenizerRequest {
  // IDs must be unique; sparse IDs and empty token values are allowed.
  // Binary format: little-endian int32 count, then int32 byte length and raw
  // bytes per token, assigning IDs from zero. JSON is a UTF-8 text-to-ID object.
  oneof vocabulary {
    TokenizerVocabulary tokens = 1;
    bytes vocabulary_json = 2;
    bytes vocabulary_binary = 3;
  }
  // UTF-8 merge lines, ordered by priority. Blank/comment lines, unresolved
  // pairs and repeated pairs are ignored. Leading U+0120 denotes a space.
  bytes merges = 4;
}
message TokenizerRef {
  // @api {"handle_kind":"Tokenizer"}
  int64 tokenizer_id = 1;
}
message TokenizerHandle {
  int64 tokenizer_id = 1;
  uint32 vocabulary_size = 2;
  uint32 merge_count = 3;
  OperationReport report = 4;
}
enum TokenizationMode {
  // Greedy byte matching when no valid merges exist; otherwise Unicode
  // letter/number/punctuation/whitespace pretokenization and ranked BPE.
  TOKENIZATION_MODE_AUTO = 0;
  TOKENIZATION_MODE_GREEDY = 1;
  // Apply BPE to the whole text as one chunk, without pretokenization.
  TOKENIZATION_MODE_BPE_WORD = 2;
}
message EncodeTextRequest {
  // @api {"handle_kind":"Tokenizer","required":true}
  int64 tokenizer_id = 1;
  string text = 2;
  // @api {"engine_default":"256"}
  optional uint32 max_tokens = 3; // Default 256; explicit zero returns empty.
  TokenizationMode mode = 4;
}
message EncodedText {
  repeated uint32 tokens = 1;
  OperationReport report = 2;
}
message DecodeTokensRequest {
  // @api {"handle_kind":"Tokenizer","required":true}
  int64 tokenizer_id = 1;
  repeated uint32 tokens = 2;
}
message DecodedText {
  // Decode each token independently with UTF-8 replacement, then replace
  // U+0120 with space and concatenate. Unknown IDs contribute empty text.
  string text = 1;
  OperationReport report = 2;
}

// The inference lifecycle: Runtime, Model, CompiledModel, ExecutionContext,
// Result. Present in every build profile.
service VxInferenceService {
  // @api {"effect":"CREATE"}
  rpc CreateRuntime(CreateRuntimeRequest) returns (RuntimeHandle);
  // @api {"effect":"RELEASE"}
  rpc ReleaseRuntime(RuntimeRef) returns (OperationReport);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["runtime_id"]}]}
  rpc ListBackends(RuntimeRef) returns (BackendList);

  // @api {"effect":"CREATE","rules":[{"kind":"LIVE_HANDLE","fields":["runtime_id"]}]}
  rpc LoadModel(LoadModelRequest) returns (ModelHandle);
  // Inspect the immutable logical input/output contract without compiling or
  // executing the model. Symbol names, bounds and divisibility are preserved.
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["model_id"]}]}
  rpc GetModelInfo(ModelRef) returns (ModelInfo);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["model_id"]}]}
  rpc GetModelRevision(ModelRef) returns (RevisionInfo);
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["model_id"]}]}
  rpc PublishAdapter(PublishAdapterRequest) returns (AdapterRevision);
  // @api {"effect":"RELEASE"}
  rpc ReleaseModel(ModelRef) returns (OperationReport);

  // @api {"effect":"CREATE","rules":[{"kind":"LIVE_HANDLE","fields":["model_id"]}]}
  rpc CompileModel(CompileModelRequest) returns (CompiledModelHandle);
  // @api {"effect":"RELEASE"}
  rpc ReleaseCompiledModel(CompiledModelRef) returns (OperationReport);

  // Direct submission of one logical request against a compiled
  // route, including a caller-authored bulk B=N binding. Allocates no request
  // handle and no Runtime coordinator. A busy route returns BUSY and never
  // falls back to scheduling.
  // @api {"effect":"EXECUTE","rules":[{"kind":"LIVE_HANDLE","fields":["compiled_model_id"]},{"kind":"COMPLETE_INPUT_BATCH","fields":["inputs"]}]}
  rpc Run(RunRequest) returns (ExecutionResultHandle);

  // @api {"effect":"CREATE","rules":[{"kind":"LIVE_HANDLE","fields":["compiled_model_id"]}]}
  rpc CreateExecutionContext(CreateExecutionContextRequest)
      returns (ExecutionContextHandle);
  // @api {"effect":"RELEASE"}
  rpc ReleaseExecutionContext(ExecutionContextRef) returns (OperationReport);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["context_id"]}]}
  rpc GetInputAffineQuantization(GetInputAffineQuantizationRequest)
      returns (AffineQuantization);

  // @api {"effect":"EXECUTE","rules":[{"kind":"LIVE_HANDLE","fields":["context_id"]},{"kind":"COMPLETE_INPUT_BATCH","fields":["inputs"]}]}
  rpc Execute(ExecuteRequest) returns (ExecutionResultHandle);
  // Recompute only the leading row_count rows of a fixed-shape sequence
  // graph. Ordinary execution without retained decode/KV state.
  // @api {"effect":"EXECUTE","rules":[{"kind":"LIVE_HANDLE","fields":["context_id"]},{"kind":"COMPLETE_INPUT_BATCH","fields":["inputs"]}]}
  rpc ExecutePrefix(ExecutePrefixRequest) returns (ExecutionResultHandle);

  // @api {"effect":"EXECUTE","rules":[{"kind":"LIVE_HANDLE","fields":["context_id"]},{"kind":"COMPLETE_INPUT_BATCH","fields":["inputs"]}]}
  rpc DecodePrefill(DecodePrefillRequest) returns (ExecutionResultHandle);
  // @api {"effect":"EXECUTE","rules":[{"kind":"LIVE_HANDLE","fields":["context_id"]},{"kind":"PREFILLED_CONTEXT","fields":["context_id"]}]}
  rpc DecodeStep(DecodeStepRequest) returns (ExecutionResultHandle);
  // @api {"effect":"EXECUTE","rules":[{"kind":"LIVE_HANDLE","fields":["context_id"]},{"kind":"PREFILLED_CONTEXT","fields":["context_id"]}]}
  rpc DecodeGenerate(DecodeGenerateRequest) returns (ExecutionResultHandle);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["context_id"]}]}
  rpc GetDecodeState(ExecutionContextRef) returns (DecodeContextState);
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["context_id"]}]}
  rpc ResetDecode(ExecutionContextRef) returns (OperationReport);
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["context_id"]},{"kind":"PREFILLED_CONTEXT","fields":["context_id"]}]}
  rpc ConfigureDecodeCache(ConfigureDecodeCacheRequest) returns (DecodeCacheState);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["context_id"]}]}
  rpc GetDecodeCache(ExecutionContextRef) returns (DecodeCacheState);
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["context_id"]}]}
  rpc PublishDecodePrefix(PublishDecodePrefixRequest) returns (DecodeCacheState);
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["context_id"]}]}
  rpc ReuseDecodePrefix(ReuseDecodePrefixRequest) returns (DecodeCacheState);
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["context_id"]}]}
  rpc ReleaseDecodeLane(DecodeLaneRef) returns (DecodeCacheState);
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["context_id"]}]}
  rpc EvictDecodePrefixes(EvictDecodePrefixesRequest) returns (DecodeCacheState);

  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["context_id"]}]}
  rpc SelectAdapter(SelectAdapterRequest) returns (OperationReport);
  // Adopts the single model revision most recently published by
  // PublishAdapter. Existing contexts never change revisions implicitly.
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["context_id"]}]}
  rpc RebindAdapter(ExecutionContextRef) returns (OperationReport);

  // Nonblocking completion query. PENDING is successful acceptance, not BUSY.
  // READY exposes all outputs. FAILED carries the execution failure report.
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["result_id"]}]}
  rpc GetResult(ResultRef) returns (ResultInfo);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["result_id"]}]}
  rpc ReadOutput(ReadOutputRequest) returns (ReadOutputResponse);
  // @api {"effect":"RELEASE"}
  rpc ReleaseResult(ResultRef) returns (OperationReport);
}

// Cross-request admission, fairness, deadlines, and coalescing. This is the
// serving composition above the policy-neutral engine submission seam. A
// Runtime created with EXECUTION_MODE_DIRECT rejects Submit. BatchQueue is an
// independent policy owner for application workers, including asynchronous
// workers; it does not implicitly execute a model or allocate device tensors.
service VxSchedulerService {
  // @api {"effect":"CREATE","rules":[{"kind":"LIVE_HANDLE","fields":["compiled_model_id"]},{"kind":"SCHEDULED_RUNTIME","fields":["compiled_model_id"]},{"kind":"COMPLETE_INPUT_BATCH","fields":["inputs"]}]}
  rpc Submit(SubmitRequest) returns (RequestHandle);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["request_id"]}]}
  rpc PollRequest(RequestRef) returns (RequestInfo);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["request_id"]}]}
  // Completes asynchronously when the request becomes terminal. A call deadline
  // or cancellation ends only this wait; CancelRequest cancels engine work.
  rpc WaitRequest(RequestRef) returns (RequestInfo);
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["request_id"]}]}
  rpc CancelRequest(RequestRef) returns (OperationReport);
  // Transfers the retained immutable result to the caller, who releases it
  // through VxInferenceService.ReleaseResult.
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["request_id"]}]}
  rpc TakeRequestResult(RequestRef) returns (ExecutionResultHandle);
  // @api {"effect":"RELEASE"}
  rpc ReleaseRequest(RequestRef) returns (OperationReport);
  // @api {"effect":"CREATE"}
  rpc CreateBatchQueue(CreateBatchQueueRequest) returns (BatchQueueHandle);
  // @api {"effect":"CREATE","rules":[{"kind":"LIVE_HANDLE","fields":["queue_id"]}]}
  rpc SubmitBatchWork(SubmitBatchWorkRequest) returns (BatchWorkHandle);
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["queue_id"]}]}
  rpc NextBatchDispatch(BatchQueueRef) returns (BatchDispatch);
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["queue_id"]}]}
  rpc CompleteBatchDispatch(CompleteBatchDispatchRequest) returns (OperationReport);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["queue_id"]}]}
  rpc GetBatchWork(BatchWorkRef) returns (BatchWorkInfo);
  // Copies a terminal value/result packet and removes it from queue retention.
  // Returns BUSY for active work and NOT_FOUND after an earlier take/eviction.
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["queue_id"]}]}
  rpc TakeBatchWork(BatchWorkRef) returns (BatchWorkInfo);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["queue_id"]}]}
  rpc GetBatchQueue(BatchQueueRef) returns (BatchQueueInfo);
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["queue_id"]}]}
  rpc CancelBatchWork(BatchWorkRef) returns (OperationReport);
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["queue_id"]}]}
  rpc CloseBatchQueue(CloseBatchQueueRequest) returns (OperationReport);
  // @api {"effect":"RELEASE"}
  rpc ReleaseBatchQueue(BatchQueueRef) returns (OperationReport);
}

// C owns compatibility grouping, admission, token budgets, padding, lane/page
// reservations, prefix reuse and retirement. The application supplies work and
// executes each returned dispatch using its chosen worker. There is no product
// TypeScript scheduler. Inference workers can use VxInferenceService; page plans
// here describe worker-owned storage and are not an ExecutionContext binding.
enum BatchWorkKind {
  BATCH_WORK_KIND_STATELESS = 0;
  BATCH_WORK_KIND_PREFILL = 1;
  BATCH_WORK_KIND_DECODE = 2;
}
enum BatchWorkState {
  BATCH_WORK_STATE_UNKNOWN = 0; // invalid ID or evicted terminal record
  BATCH_WORK_STATE_QUEUED = 1;
  BATCH_WORK_STATE_PREFILL = 2;
  BATCH_WORK_STATE_DECODING = 3;
  BATCH_WORK_STATE_COMPLETED = 4;
  BATCH_WORK_STATE_CANCELLED = 5;
  BATCH_WORK_STATE_FAILED = 6;
}
enum BatchQueuePolicy {
  BATCH_QUEUE_POLICY_WORK_CONSERVING = 0;
  BATCH_QUEUE_POLICY_FILL_FIRST = 1;
}
message BatchCacheOptions {
  uint32 lanes = 1;
  uint32 page_tokens = 2;
  uint32 lane_token_capacity = 3;
  optional uint32 max_pages = 4; // default: fully private lane capacity
  DecodeCachePolicy policy = 5;
}
message CreateBatchQueueRequest {
  optional uint32 max_queue_depth = 1; // default: 4 * lane count
  optional uint32 token_budget = 2; // per dispatch, including padding; default 2048
  optional uint32 max_lanes = 3; // default: cache lanes, or 8 without a cache
  optional uint32 multiple_of = 4; // stateless batch divisibility; default 1
  BatchQueuePolicy policy = 5;
  uint64 max_wait_micros = 6; // fill-first only; real monotonic arrival time
  optional uint32 queue_depth_window = 7; // default 1024 recent rounds
  optional uint32 retained_results = 8; // default: 2 * queue depth + lane count
  BatchCacheOptions cache = 9; // required for decode work; metadata only
}
message BatchQueueRef {
  // @api {"handle_kind":"BatchQueue"}
  int64 queue_id = 1;
}
message BatchQueueHandle {
  int64 queue_id = 1;
  OperationReport report = 2;
}
message BatchGroup {
  string model = 1; // omitted/empty defaults to "default"
  optional string adapter_revision = 2; // absence differs from an empty revision
  string shape_signature = 3; // defaults to "stateless" or "llm"
  // Equality compares each component, never a delimiter-concatenated string.
}
message StatelessBatchWork {
  uint32 rows = 1;
  repeated Tensor inputs = 2; // copied at submission, returned unchanged to worker
}
message DecodeBatchWork {
  uint32 prompt_tokens = 1;
  uint32 max_tokens = 2;
  // Context-local identity of the complete prompt semantics, including model,
  // adapter and positional inputs. Only complete prompt pages are published.
  optional string prompt_key = 3;
}
message SubmitBatchWorkRequest {
  // @api {"handle_kind":"BatchQueue","required":true}
  int64 queue_id = 1;
  BatchGroup group = 2;
  bytes payload = 3; // uninterpreted application data, copied at submission
  oneof work {
    StatelessBatchWork stateless = 4;
    DecodeBatchWork decode = 5;
  }
}
message BatchWorkRef {
  // @api {"handle_kind":"BatchQueue"}
  int64 queue_id = 1;
  // @api {"handle_kind":"BatchWork"}
  uint32 work_id = 2; // queue-scoped, never reused
}
message BatchWorkHandle {
  int64 queue_id = 1;
  uint32 work_id = 2;
  OperationReport report = 3;
}
message BatchDispatchWork {
  uint32 work_id = 1; // zero for a padding item
  uint32 rows = 2;
  sint32 lane = 3; // -1 for stateless work
  uint32 lane_generation = 4;
  uint32 position = 5;
  uint32 tokens = 6;
  uint32 kv_length = 7;
  repeated sint32 pages = 8; // logical-to-physical pages; -1 is unmapped
  uint32 page_tokens = 9;
  uint32 generated = 10;
  bool padding = 11; // duplicates the first item's inputs; outcome is discarded
  bytes payload = 12;
  repeated Tensor inputs = 13;
}
message BatchDispatch {
  int64 queue_id = 1;
  // Zero means no work is ready. The same nonzero dispatch is returned until
  // completed; polling never repeats admission or a reservation. Only one
  // dispatch is exposed at a time. A round visits each ready group once.
  uint64 dispatch_id = 2;
  BatchWorkKind kind = 3;
  BatchGroup group = 4;
  uint32 rows_per_item = 5;
  uint32 useful_items = 6;
  uint32 useful_rows = 7;
  uint32 total_rows = 8;
  repeated BatchDispatchWork work = 9;
  uint64 round = 10;
  OperationReport report = 11;
}
message BatchWorkOutcome {
  bool finished = 1; // stop decode before max_tokens; ignored for prefill
  optional bytes value = 2; // appended to this request's value history
  repeated Tensor outputs = 3; // copied; replaces this request's last outputs
  string error = 4; // any useful item's error fails the entire dispatch
}
message CompleteBatchDispatchRequest {
  // @api {"handle_kind":"BatchQueue","required":true}
  int64 queue_id = 1;
  uint64 dispatch_id = 2;
  // Exactly one outcome per dispatched item, including padding, unless error
  // is supplied. Invalid IDs/counts/payloads leave the pending dispatch intact.
  repeated BatchWorkOutcome outcomes = 3;
  string error = 4; // worker-wide failure; rolls back reservations
}
message BatchValue { bytes data = 1; }
message BatchWorkInfo {
  int64 queue_id = 1;
  uint32 work_id = 2;
  BatchWorkState state = 3;
  uint32 generated = 4;
  sint32 lane = 5;
  repeated BatchValue values = 6;
  repeated Tensor outputs = 7;
  string error = 8;
  OperationReport report = 9;
}
message BatchQueueInfo {
  int64 queue_id = 1;
  bool closed = 2;
  bool draining = 3;
  uint64 pending_dispatch_id = 4;
  uint64 rounds = 5;
  uint64 dispatches = 6;
  uint64 rows_dispatched = 7;
  uint64 rows_useful = 8;
  // Time from first exposure to completion, summed over nonoverlapping worker
  // dispatches. This measures worker turnaround, not GPU hardware utilization.
  uint64 worker_busy_micros = 9;
  uint64 wall_micros = 10;
  double worker_utilization = 11;
  double padding_waste = 12;
  uint32 queue_depth = 13;
  uint32 max_queue_depth_seen = 14;
  uint32 queue_depth_p50 = 15;
  uint32 queue_depth_p99 = 16;
  uint32 group_count = 17;
  uint32 active_lanes = 18;
  uint32 free_lanes = 19;
  uint64 admitted = 20;
  uint64 completed = 21;
  uint64 cancelled = 22;
  uint64 failed = 23;
  uint64 steps = 24;
  uint64 admission_stalls = 25;
  uint64 queue_delay_rounds = 26;
  uint64 prefix_reuses = 27;
  uint64 prefix_publications = 28;
  uint64 prefill_tokens = 29;
  uint64 shared_prompt_tokens = 30;
  uint32 active_records = 31;
  uint32 retained_results = 32;
  uint32 max_retained_results = 33;
  uint32 resident_pages = 34;
  uint32 reserved_pages = 35;
  uint32 free_pages = 36;
  uint32 shared_pages = 37;
  uint64 evictions = 38;
  OperationReport report = 39;
}
message CloseBatchQueueRequest {
  // @api {"handle_kind":"BatchQueue","required":true}
  int64 queue_id = 1;
  // Stops admission and cancels queued work. With drain, already admitted work
  // remains available through Next/Complete until terminal. Without drain all
  // pending work is cancelled and dispatch IDs are revoked. Release always
  // cancels and frees the policy owner; worker device resources remain its own.
  bool drain = 2;
}

// Immutable logical-graph analysis shared by runtime providers and offline
// authoring. A GraphPlan is semantic metadata: it contains no model-weight or
// activation payload, provider allocation, executable command, or backend
// resource. Present in every build profile.
service VxPlanningService {
  // @api {"effect":"CREATE"}
  rpc CreateGraphPlan(CreateGraphPlanRequest) returns (GraphPlanHandle);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["graph_plan_id"]}]}
  rpc GetGraphPlan(GraphPlanRef) returns (GraphPlanInfo);
  // @api {"effect":"CREATE","rules":[{"kind":"LIVE_HANDLE","fields":["graph_plan_id"]}]}
  rpc EditGraphPlan(EditGraphPlanRequest) returns (GraphPlanHandle);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["graph_plan_id"]}]}
  rpc ExportGraphPlan(GraphPlanRef) returns (ExportedGraphPlan);
  // Serialize typed authoring state without requiring weight/scale payloads.
  // CreateGraphPlan or LoadModel performs binding and semantic validation.
  // @api {"effect":"READ_ONLY"}
  rpc SerializeGraph(GraphDefinition) returns (SerializedGraph);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["graph_plan_id"]}]}
  rpc ResolveGraphPlan(ResolveGraphPlanRequest) returns (ResolvedGraphPlan);
  // @api {"effect":"RELEASE"}
  rpc ReleaseGraphPlan(GraphPlanRef) returns (OperationReport);
  // @api {"effect":"READ_ONLY"}
  rpc InspectSafetensors(InspectSafetensorsRequest) returns (SafetensorsInfo);
  // @api {"effect":"READ_ONLY"}
  rpc ReadSafetensors(ReadSafetensorsRequest) returns (SafetensorsContent);
  // @api {"effect":"CREATE"}
  rpc WriteSafetensors(WriteSafetensorsRequest) returns (SafetensorsArtifact);
}

// Full-profile training authoring. Trainer state is private and publishes a
// successor Model weight revision only through CommitTrainer.
service VxTrainingService {
  // @api {"effect":"CREATE"}
  rpc InitializeTensor(InitializeTensorRequest) returns (InitializedTensor);
  // @api {"effect":"CREATE","rules":[{"kind":"LIVE_HANDLE","fields":["graph_plan_id"]}]}
  rpc BuildLoraLinear(BuildLoraLinearRequest) returns (LoraLinearPlan);
  // @api {"effect":"CREATE","rules":[{"kind":"LIVE_HANDLE","fields":["graph_plan_id"]}]}
  rpc BuildRoutedAdapter(BuildRoutedAdapterRequest) returns (RoutedAdapterPlan);
  // @api {"effect":"CREATE","rules":[{"kind":"LIVE_HANDLE","fields":["model_id"]}]}
  rpc CreateTrainer(CreateTrainerRequest) returns (TrainerHandle);
  // @api {"effect":"RELEASE"}
  rpc ReleaseTrainer(TrainerRef) returns (OperationReport);
  // @api {"effect":"EXECUTE","rules":[{"kind":"LIVE_HANDLE","fields":["trainer_id"]}]}
  rpc TrainStep(TrainStepRequest) returns (TrainStepResult);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["trainer_id"]}]}
  rpc GetTrainStep(TrainStepRef) returns (TrainStepResult);
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["trainer_id"]}]}
  rpc CommitTrainer(TrainerRef) returns (RevisionInfo);
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["trainer_id"]}]}
  rpc RollbackTrainer(TrainerRef) returns (OperationReport);
  // @api {"effect":"CREATE","rules":[{"kind":"LIVE_HANDLE","fields":["trainer_id"]}]}
  rpc ExportTrainerWeights(ExportTrainerWeightsRequest)
      returns (TrainerWeights);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["trainer_id"]}]}
  rpc GetTrainerState(TrainerRef) returns (TrainerState);
  // @api {"effect":"MUTATE","rules":[{"kind":"LIVE_HANDLE","fields":["trainer_id"]}]}
  rpc ResetTrainerAccumulation(TrainerRef) returns (TrainerState);
  // @api {"effect":"CREATE","rules":[{"kind":"LIVE_HANDLE","fields":["trainer_id"]}]}
  rpc ExportTrainerCheckpoint(ExportTrainerCheckpointRequest)
      returns (TrainerCheckpointInfo);
}

// Full-profile post-training quantization authoring.
service VxQuantizationService {
  // @api {"effect":"CREATE","rules":[{"kind":"LIVE_HANDLE","fields":["trainer_id"]}]}
  rpc ExportQuantizedTrainerWeights(ExportQuantizedTrainerWeightsRequest)
      returns (QuantizedTrainerWeights);
  // @api {"effect":"CREATE"}
  rpc QuantizeWeight(QuantizeWeightRequest) returns (QuantizedWeight);
  // @api {"effect":"CREATE"}
  rpc DequantizeWeight(DequantizeWeightRequest) returns (InitializedTensor);
  // @api {"effect":"CREATE"}
  rpc AuthorPtqTemplate(AuthorPtqTemplateRequest) returns (PtqTemplateInfo);
  // @api {"effect":"CREATE","rules":[{"kind":"LIVE_HANDLE","fields":["model_id"]}]}
  rpc CreatePtqPlan(CreatePtqPlanRequest) returns (PtqPlanHandle);
  // @api {"effect":"RELEASE"}
  rpc ReleasePtqPlan(PtqPlanRef) returns (OperationReport);
  // @api {"effect":"EXECUTE","rules":[{"kind":"LIVE_HANDLE","fields":["ptq_plan_id"]}]}
  rpc CalibratePtqPlan(CalibratePtqPlanRequest) returns (PtqCalibrationInfo);
  // @api {"effect":"READ_ONLY","rules":[{"kind":"LIVE_HANDLE","fields":["ptq_plan_id"]}]}
  rpc InspectPtqPlan(PtqPlanRef) returns (PtqPlanInfo);
  // @api {"effect":"CREATE","rules":[{"kind":"LIVE_HANDLE","fields":["ptq_plan_id"]}]}
  rpc WritePtqPackage(WritePtqPackageRequest) returns (PtqPackageInfo);
}

message Empty {}

