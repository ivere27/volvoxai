// Internal VolvoxAI optimizer-pass inventory.
//
// This registry is the authored source of truth for typed optimizer pass
// metadata and deterministic pipeline recipes.  It is not part of the public
// Synurang FFI in volvoxai.proto, and it does not encode executable matchers.
// Stable implementation IDs bind pass declarations to executable IRPass code.
// tools/generate_optimizer_registry.py validates declarations against
// OperatorKind and the kernel registry, then emits dependency-free Python and
// Markdown views.

syntax = "proto3";

package volvoxai.optimizer_registry;

import "google/protobuf/descriptor.proto";
import "kernel_registry.proto";
import "volvoxai.proto";

enum OptimizerPassScope {
  OPTIMIZER_PASS_SCOPE_UNSPECIFIED = 0;

  // Rewrites the portable graph.json + safetensors package transactionally.
  OPTIMIZER_PASS_SCOPE_PORTABLE_PACKAGE = 1;

  // Derives backend-owned CompiledModel state without changing the package.
  // No current v1 typed RuntimeIR pass uses this scope yet.
  OPTIMIZER_PASS_SCOPE_COMPILED_PREPARATION = 2;
}

enum OptimizerDialect {
  OPTIMIZER_DIALECT_UNSPECIFIED = 0;
  OPTIMIZER_DIALECT_SOURCE = 1;
  OPTIMIZER_DIALECT_SEMANTIC = 2;
  OPTIMIZER_DIALECT_CANONICAL = 3;
  OPTIMIZER_DIALECT_QUANTIZED_CANONICAL = 4;
  OPTIMIZER_DIALECT_RUNTIME = 5;
}

enum OptimizerPassStage {
  OPTIMIZER_PASS_STAGE_UNSPECIFIED = 0;
  OPTIMIZER_PASS_STAGE_LOWERING = 1;
  OPTIMIZER_PASS_STAGE_CANONICALIZATION = 2;
  OPTIMIZER_PASS_STAGE_SEMANTIC_FUSION = 3;
  OPTIMIZER_PASS_STAGE_PRECISION_AUTHORING = 4;
  OPTIMIZER_PASS_STAGE_QUANTIZED_REGION = 5;
  OPTIMIZER_PASS_STAGE_ABI_SPECIALIZATION = 6;
  OPTIMIZER_PASS_STAGE_CLEANUP = 7;
  OPTIMIZER_PASS_STAGE_TARGET_PREPARATION = 8;
}

enum RewriteSemantics {
  REWRITE_SEMANTICS_UNSPECIFIED = 0;

  // The pass proves the represented graph result or storage transform exact.
  REWRITE_SEMANTICS_EXACT = 1;

  // The pass intentionally changes a rounding/evaluation boundary and needs
  // explicit caller opt-in plus independent qualification.
  REWRITE_SEMANTICS_NUMERICAL_MIGRATION = 2;

  // The pass authors a new calibrated precision contract and serialized
  // quantization payloads.  This is never implied by exact optimization or
  // by an already-quantized import.
  REWRITE_SEMANTICS_QUANTIZATION_AUTHORING = 3;
}

message OptimizerFeatureDescriptor {
  string id = 1;
  string summary = 2;
}

// Empty target rules mean that a portable pass has no additional backend
// eligibility constraint. A rule declares the operators and kernel variants
// required on each named backend; the resolver evaluates these facts directly.
message OptimizerTargetRule {
  reserved 2, 3;
  reserved "applicability_predicate_id", "cost_model_id";

  repeated volvoxai.kernel_registry.BackendKind backend = 1;
  repeated volvoxai.runtime.OperatorKind required_operator = 4;
  repeated string required_kernel_variant_id = 5;
}

message OptimizerPassDescriptor {
  reserved 16, 17, 18, 19;
  reserved "required_analysis", "preserved_analysis", "invalidated_analysis",
      "legality_predicate_id";

  string id = 1;
  uint32 version = 2;
  string implementation_id = 3;
  string summary = 4;

  OptimizerPassScope scope = 5;
  OptimizerPassStage stage = 6;
  repeated OptimizerDialect input_dialect = 7;
  OptimizerDialect output_dialect = 8;
  bool repeatable = 9;

  RewriteSemantics semantics = 10;
  bool requires_calibration = 11;
  bool changes_public_abi = 12;
  bool changes_precision = 13;

  repeated volvoxai.runtime.OperatorKind matched_operator = 14;
  repeated volvoxai.runtime.OperatorKind emitted_operator = 15;

  // These are relative ordering constraints when both passes are selected;
  // they do not implicitly select another pass.
  repeated string must_run_after = 20;
  repeated string must_run_before = 21;
  repeated string conflicts_with = 22;

  repeated OptimizerTargetRule target = 23;
}

message OptimizerPassGroup {
  string id = 1;
  string summary = 2;
  repeated string pass_id = 3;
  bool fixed_point = 4;
  uint32 max_iterations = 5;
}

message OptimizerPipelineGroupOverlay {
  string group_id = 1;

  // An overlay is selected in declaration order when every required feature
  // is requested and no forbidden feature is requested. Empty gates make an
  // unconditional base group. This keeps independent optimizer features
  // composable without materializing their Cartesian product as recipes.
  repeated string required_feature = 2;
  repeated string forbidden_feature = 3;
}

message OptimizerPipelineRecipe {
  string id = 1;
  uint32 version = 2;
  string summary = 3;
  reserved 4, 9, 10;
  reserved "group_id", "applicability_predicate_id", "selection_feature";

  // Empty means target-neutral.  A non-empty list is an allowlist, not proof
  // that every graph descriptor is legal on the backend.
  repeated volvoxai.kernel_registry.BackendKind target = 5;
  repeated RewriteSemantics allowed_semantics = 6;
  bool allow_calibration = 7;
  bool allow_public_abi_change = 8;
  // A recipe matches when every required feature is requested and every
  // requested feature belongs to required_feature or supported_feature.
  // Matching recipe domains must be unambiguous.
  repeated OptimizerPipelineGroupOverlay group_overlay = 11;
  repeated string required_feature = 12;
  repeated string supported_feature = 13;
}

message OptimizerRegistry {
  reserved 2;
  reserved "analysis";

  uint32 schema_version = 1;
  repeated OptimizerPassDescriptor pass = 3;
  repeated OptimizerPassGroup group = 4;
  repeated OptimizerPipelineRecipe pipeline = 5;
  repeated OptimizerFeatureDescriptor feature = 6;
}

extend google.protobuf.FileOptions {
  OptimizerRegistry registry = 52001;
}

