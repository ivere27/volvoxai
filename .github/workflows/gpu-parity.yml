name: Physical GPU parity

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volvoxai-physical-rtx3090
  cancel-in-progress: false

jobs:
  required-gpu-parity:
    name: Required RTX 3090 parity
    if: github.repository == 'ivere27/volvoxai' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, volvoxai-rtx3090]
    timeout-minutes: 180
    env:
      CI: 'true'
      DENO_WEBGPU_BACKEND: vulkan
      DRI_PRIME: '1'
      VOLVOXAI_PARITY_GPU_ADAPTER: RTX 3090
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tools/requirements-export.txt
            examples/tinystories/requirements-export.txt
            tests/parity/external/requirements.txt

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.3

      - name: Verify and record the physical runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/parity/out
          {
            echo 'expected_adapter=RTX 3090'
            # Record the model/driver needed to audit the physical route, but
            # do not publish the runner's stable per-device UUID.
            nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
            node --version
            deno --version
            python3 --version
            docker --version
          } | tee tests/parity/out/hardware.txt
          grep -Fq 'NVIDIA GeForce RTX 3090' tests/parity/out/hardware.txt
          docker info >/dev/null

      - name: Restore exported parity models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: models
          key: gpu-parity-models-v4-${{ hashFiles('tools/requirements-export.txt', 'examples/**/requirements-export.txt', 'tools/**/*.py', 'examples/**/tools/**', 'tests/parity/policy.json') }}

      - name: Install build and oracle dependencies
        run: |
          python3 -m pip install -r tools/requirements-export.txt
          python3 -m pip install -r examples/tinystories/requirements-export.txt
          python3 -m pip install -r tests/parity/external/requirements.txt

      - name: Materialize model packages
        shell: bash
        run: |
          set -euo pipefail
          required=(
            models/tinystories_1m/graph.json
            models/tinystories_1m/model.safetensors
            models/tinystories_1m/tokens.i32
            models/tinystories_1m/positions.i32
            models/efficientdet_lite0_int8/graph.json
            models/efficientdet_lite0_int8/model.safetensors
            models/efficientdet_lite0_int8/efficientdet_lite0.onnx
            models/efficientdet_lite0_fp32/graph.json
            models/efficientdet_lite0_fp32/model.safetensors
            models/efficientdet_lite0_fp32/efficientdet_lite0_float32.onnx
          )
          missing=0
          for file in "${required[@]}"; do
            [[ -s "$file" ]] || missing=1
          done
          (( missing == 0 )) || make models
          for file in "${required[@]}"; do
            test -s "$file"
          done
          make validate_model_packages

      - name: Build inference and full profiles
        run: |
          npm ci
          npm run build:all
          make build_wasm
          make build_native NATIVE_BUILD_JOBS=1
          npm run check:release

      - name: Run the fail-closed GPU campaign
        shell: bash
        run: |
          set -euo pipefail
          rm -f tests/parity/out/gpu_required.log
          make parity_gpu_required DENO=deno 2>&1 | tee tests/parity/out/gpu_required.log

      - name: Upload GPU parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-gpu-parity-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            tests/parity/out/hardware.txt
            tests/parity/out/gpu_required.log
            tests/parity/out/gpu_required_summary.json
            tests/parity/out/report.md
            tests/parity/out/report.json
            tests/parity/out/op_matrix.md
            tests/parity/out/graph_matrix.md
            tests/parity/out/coverage.md
            tests/parity/out/manifests/*.json
            tests/parity/out/*.webgpu.json
            tests/parity/out/*.native-vulkan.json
            tests/parity/out/*.native-opengl.json
            tests/parity/out/ops/*.webgpu.json
            tests/parity/out/ops/*.native-vulkan.json
            tests/parity/out/ops/*.native-opengl.json
            tests/parity/out/graphsigs/*.webgpu.json
            tests/parity/out/graphsigs/*.native-vulkan.json
            tests/parity/out/graphsigs/*.native-opengl.json
            tests/parity/out/gpu_consensus/summary.json
            tests/parity/kvcache/out/*.json
            tests/parity/kvcache/out/*.md
