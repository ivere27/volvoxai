name: Build, test, and release

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_nightly:
        description: 'Update the rolling nightly pre-release after build (master branch only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate tag matches package.json and project declarations
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p 'require("./package.json").version')
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error::Release tag v$tag does not match package.json version $pkg_version"
            exit 1
          fi
          node tools/set_version.mjs --check

  test-javascript:
    name: JavaScript and WASM verification
    needs: [preflight]
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      DOCKER_PREBUILT: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned Synurang code generator
        uses: actions/cache@v4
        with:
          path: build/cache/synurang-codegen
          key: ${{ runner.os }}-${{ runner.arch }}-synurang-codegen-${{ hashFiles('tools/generate_proto.py') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tools/requirements-codegen.txt
            tools/requirements-export.txt
            tests/parity/external/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev libvulkan1 mesa-vulkan-drivers clang lld
      - run: npm ci
      - run: >-
          python3 -m pip install
          -r tools/requirements-codegen.txt
          -r tools/requirements-export.txt
          -r tests/parity/external/requirements.txt
      - run: make proto_codegen_check
      - name: Release version and tool path regressions
        run: node --test tests/release_version.test.mjs tests/release_version_literals.test.mjs tests/webgpu_tool_release_paths.test.mjs
      - run: npm run typecheck
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build pinned toolchain container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: volvoxai-build:latest
          cache-from: type=gha,scope=volvoxai-build
      - run: make build_native
      - run: make test_contracts
      - run: npm run build:all
      - run: make build_wasm
      - run: npm run test:size
      - run: npm run test:webgpu-contracts
      - run: npm run test:proto-api
      - run: npm run test:wasm-inference-plan
      - run: npm run test:planning-call-sequence
      - run: make test_wasm_baseline_simd
      - run: npm run test:wasm-training-smoke
      - run: npm run test:wasm-ptq
      - run: make test_onnx_oracle
      - run: make test_quantized_oracle
      - run: make check_release
      - run: make size_report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-oracle-reports
          path: |
            build/test-reports/onnx-oracle.json
            build/test-reports/quantized-oracle.json
            build/size-reports/release-size.json
            build/size-reports/release-size.md
          if-no-files-found: ignore

  test-native:
    name: Native engine and generated FFI
    needs: [preflight]
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      DOCKER_PREBUILT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements-test.txt
      - name: Install native build dependencies (compiler toolchain runs inside Docker)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            libvulkan-dev
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build pinned toolchain container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: volvoxai-build:latest
          cache-from: type=gha,scope=volvoxai-build
      - run: make test_native
      - run: make test_native_gpu_static
      - name: Gate native W8A8 release throughput
        run: make benchmark_native_w8a8_release
      - run: npm ci
      - run: python3 -m pip install -r python/requirements-test.txt
      - name: Run current public lifecycle through the Synurang FFI
        run: make test_python
      - name: Build and link inference/full CUDA profiles without a device
        run: >-
          make build_native_profiles
          CMAKE_BUILD_DIR=build/cmake-cuda
          NATIVE_BUILD_JOBS=2
          CMAKE_CONFIG='-DCMAKE_C_COMPILER=clang-17
          -DVOLVOXAI_ENABLE_VULKAN=OFF
          -DVOLVOXAI_ENABLE_OPENGL=OFF
          -DVOLVOXAI_ENABLE_METAL=OFF
          -DVOLVOXAI_ENABLE_CUDA=ON
          -DVOLVOXAI_CUDA_ARCH=75
          -DVOLVOXAI_CUDA_CLANGXX_EXECUTABLE=/usr/bin/clang++-17'
      - name: Check CUDA PTX inventory and profile boundary
        run: |
          python3 tools/check_native_cuda_ptx.py --build-dir build/cmake-cuda
          native/cmake/check_profile_boundaries.sh \
            build/cmake-cuda/native/release-link/volvoxai-lite \
            build/cmake-cuda/native/release-link/volvoxai
      - name: Preserve matching native release and debug bundles
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-release-bundles
          path: |
            build/cmake/native/release-link/volvoxai-lite
            build/cmake/native/release-link/volvoxai
            build/cmake/native/release-link/.debug/volvoxai-lite.debug
            build/cmake/native/release-link/.debug/volvoxai-lite.debug.json
            build/cmake/native/release-link/.debug/volvoxai.debug
            build/cmake/native/release-link/.debug/volvoxai.debug.json
            build/cmake/size-maps/volvoxai-lite.map
            build/cmake/size-maps/volvoxai.map
            build/performance/native-w8a8-release.json
            build/cmake-cuda/native/release-link/volvoxai-lite
            build/cmake-cuda/native/release-link/volvoxai
            build/cmake-cuda/native/release-link/.debug/volvoxai-lite.debug
            build/cmake-cuda/native/release-link/.debug/volvoxai-lite.debug.json
            build/cmake-cuda/native/release-link/.debug/volvoxai.debug
            build/cmake-cuda/native/release-link/.debug/volvoxai.debug.json
            build/cmake-cuda/size-maps/volvoxai-lite.map
            build/cmake-cuda/size-maps/volvoxai.map
          if-no-files-found: ignore

  test-cuda:
    name: Physical CUDA semantic verification (RTX 3090)
    needs: [preflight, build-web]
    if: >-
      !cancelled() &&
      (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') &&
      needs.build-web.result == 'success' &&
      github.repository == 'ivere27/volvoxai' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64, rtx3090]
    timeout-minutes: 60
    env:
      CI: 'true'
      VOLVOXAI_PARITY_GPU_ADAPTER: RTX 3090
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Restore stale root-owned workspace files before checkout
        run: |
          if [ -z "$(find . -xdev -user 0 -print -quit 2>/dev/null || true)" ]; then
            exit 0
          fi

          uid_gid="$(id -u):$(id -g)"
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo find . -xdev -depth -user 0 -exec chown -h "$uid_gid" {} + \
              || echo "::warning::sudo failed to restore ownership of stale root-owned workspace files"
          elif command -v docker >/dev/null 2>&1 && docker image inspect volvoxai-build:latest >/dev/null 2>&1; then
            docker run --rm --user 0:0 --entrypoint "" -v "$PWD:/workspace" -w /workspace \
              volvoxai-build:latest find /workspace -xdev -depth -user 0 -exec chown -h "$uid_gid" {} + \
              || echo "::warning::Docker fallback failed to restore ownership of stale root-owned workspace files"
          else
            find . -xdev -depth -user 0 -exec chown -h "$uid_gid" {} + \
              || echo "::warning::Failed to restore ownership of stale root-owned workspace files"
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/parity/external/requirements.txt
      - name: Download web distribution for parity oracles
        uses: actions/download-artifact@v4
        with:
          name: volvoxai-web-dist
          path: dist
      - name: Verify physical NVIDIA RTX 3090 runner
        run: |
          set -euo pipefail
          mkdir -p build/gpu-evidence
          nvidia-smi --query-gpu=name,driver_version --format=csv,noheader \
            | tee build/gpu-evidence/hardware.txt
          test "$(wc -l < build/gpu-evidence/hardware.txt)" -eq 1
          grep -Fq 'NVIDIA GeForce RTX 3090' build/gpu-evidence/hardware.txt
          docker info >/dev/null
      - run: python3 -m pip install -r tests/parity/external/requirements.txt
      - name: Build CUDA native profiles (SM86)
        run: >-
          make build_native_profiles
          CMAKE_BUILD_DIR=build/cmake-cuda-gpu
          NATIVE_BUILD_JOBS=2
          CMAKE_CONFIG='-DCMAKE_C_COMPILER=clang-17
          -DVOLVOXAI_ENABLE_VULKAN=OFF
          -DVOLVOXAI_ENABLE_OPENGL=OFF
          -DVOLVOXAI_ENABLE_METAL=OFF
          -DVOLVOXAI_ENABLE_CUDA=ON
          -DVOLVOXAI_CUDA_ARCH=86
          -DVOLVOXAI_CUDA_CLANGXX_EXECUTABLE=/usr/bin/clang++-17'
      - name: Check CUDA PTX inventory and profile boundary
        run: |
          python3 tools/check_native_cuda_ptx.py --build-dir build/cmake-cuda-gpu
          native/cmake/check_profile_boundaries.sh \
            build/cmake-cuda-gpu/native/release-link/volvoxai-lite \
            build/cmake-cuda-gpu/native/release-link/volvoxai
      - name: Compare tiny source graphs directly with ONNX Runtime (CUDA)
        run: |
          python3 tests/parity/external/onnx_oracle.py \
            --case add_broadcast_dynamic_min_f32 \
            --case add_broadcast_dynamic_max_f32 \
            --case erf_gelu_f32 \
            --case layernorm_linear_f32 \
            --case gather_i32_indices_f32 \
            --case argmax_cast_i32 \
            --case quantize_linear_u8 \
            --case masked_attention_odd_seq_f32 \
            --native build/cmake-cuda-gpu/native/release-link/volvoxai \
            --native-backend cuda \
            --require-physical-native \
            --work-dir build/gpu-evidence/onnx \
            --report build/gpu-evidence/onnx-report.json
      - name: Check project QLinear bytes on CUDA
        run: |
          python3 tests/parity/external/quantized_oracle.py \
            --native build/cmake-cuda-gpu/native/release-link/volvoxai \
            --native-backend cuda \
            --require-physical-native \
            --work-dir build/gpu-evidence/quantized \
            --report build/gpu-evidence/quantized-report.json
      - name: Train and reload through CUDA backend
        run: |
          python3 tools/test_native_gpu_training_smoke.py \
            --native-full build/cmake-cuda-gpu/native/release-link/volvoxai \
            --native-inference build/cmake-cuda-gpu/native/release-link/volvoxai \
            --backend cuda \
            --require-physical \
            --work-dir build/gpu-evidence/native-training \
            --report build/gpu-evidence/native-training-report.json
      - name: Preserve CUDA test evidence reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuda-rtx3090-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: build/gpu-evidence
          if-no-files-found: ignore
      - name: Restore workspace permissions on self-hosted runner
        if: always()
        run: |
          if [ -z "$(find . -xdev -user 0 -print -quit 2>/dev/null || true)" ]; then
            exit 0
          fi

          uid_gid="$(id -u):$(id -g)"
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo find . -xdev -depth -user 0 -exec chown -h "$uid_gid" {} + \
              || echo "::warning::sudo failed to restore ownership of root-owned workspace files"
          elif command -v docker >/dev/null 2>&1 && docker image inspect volvoxai-build:latest >/dev/null 2>&1; then
            docker run --rm --user 0:0 --entrypoint "" -v "$PWD:/workspace" -w /workspace \
              volvoxai-build:latest find /workspace -xdev -depth -user 0 -exec chown -h "$uid_gid" {} + \
              || echo "::warning::Docker fallback failed to restore ownership of root-owned workspace files"
          else
            find . -xdev -depth -user 0 -exec chown -h "$uid_gid" {} + \
              || echo "::warning::Failed to restore ownership of root-owned workspace files"
          fi

  build-web:
    name: Package Web and WASM release profile
    needs: [preflight]
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      DOCKER_PREBUILT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Pre-populate node_modules from cache
        run: npm ci
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build pinned toolchain container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: volvoxai-build:latest
          cache-from: type=gha,scope=volvoxai-build
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,mode=max,scope=volvoxai-build' || '' }}
      - name: Build Web and WASM profiles in pinned container
        run: make build_web
      - name: Fix workspace permissions after Docker execution
        run: |
          for dir in dist build; do
            if [ -e "$dir" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$dir"
            fi
          done
      - name: Verify Web and WASM artifacts
        run: npm run check:release -- --web-only
      - name: Package web distribution archive and verify npm tarballs
        run: |
          set -euo pipefail
          pkg_version=$(node -p 'require("./package.json").version')
          mkdir -p release-archives
          tar -czf "release-archives/volvoxai-${pkg_version}-web.tar.gz" -C "dist/${pkg_version}" .
          for pkg in "volvoxai-${pkg_version}.tgz" "volvoxai-lite-${pkg_version}.tgz"; do
            src="build/npm/${pkg_version}/${pkg}"
            if [ ! -f "${src}" ]; then
              echo "::error::Missing prepared npm tarball: ${src}"
              exit 1
            fi
            cp "${src}" "release-archives/${pkg}"
          done
      - name: Upload Web distribution directory for parity oracles
        uses: actions/upload-artifact@v4
        with:
          name: volvoxai-web-dist
          path: dist/
          if-no-files-found: error
      - name: Upload Web and npm archives for GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: volvoxai-archive-web
          path: |
            release-archives/volvoxai-*-web.tar.gz
            release-archives/volvoxai-*.tgz
          if-no-files-found: error

  build-native:
    name: Package native profiles (${{ matrix.target }})
    needs: [preflight]
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # macOS Rust 툴체인 및 Naga 캐싱 (MSRV 및 아키텍처 격리)
      - name: Add cargo bin to PATH (macOS)
        if: runner.os == 'macOS'
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache Naga CLI (macOS)
        id: cache-naga
        uses: actions/cache@v4
        if: runner.os == 'macOS'
        with:
          path: ~/.cargo/bin/naga
          key: ${{ runner.os }}-${{ runner.arch }}-naga-cli-30.0.0
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS' && steps.cache-naga.outputs.cache-hit != 'true'
      - name: Install pinned WGSL compiler (macOS)
        if: runner.os == 'macOS' && steps.cache-naga.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version 30.0.0 --locked

      # Linux 빌드 (Docker를 통해 glibc 2.35 보장)
      - name: Set up Docker Buildx (Linux)
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v3
      - name: Build pinned toolchain container (Linux)
        if: runner.os == 'Linux'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: volvoxai-build:latest
          cache-from: type=gha,scope=volvoxai-build
      - name: Build Linux native binaries (glibc 2.35 via pinned container)
        if: runner.os == 'Linux'
        env:
          DOCKER_PREBUILT: '1'
        run: |
          make build_native
          for dir in native build; do
            if [ -e "$dir" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$dir"
            fi
          done
          native/cmake/check_profile_boundaries.sh native/volvoxai-lite native/volvoxai
          pkg_version=$(node -p 'require("./package.json").version')
          mkdir -p release-archives
          tar -czf "release-archives/volvoxai-${pkg_version}-${{ matrix.target }}.tar.gz" \
            -C native volvoxai volvoxai-lite

      # macOS Metal 빌드
      - name: Build macOS Metal Profiles
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build/cmake-metal \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_C_COMPILER=clang \
            -DVOLVOXAI_ENABLE_VULKAN=OFF \
            -DVOLVOXAI_ENABLE_OPENGL=OFF \
            -DVOLVOXAI_ENABLE_METAL=ON \
            -DVOLVOXAI_ENABLE_CUDA=OFF
          cmake --build build/cmake-metal --target volvoxai-lite volvoxai -j2
          native/cmake/check_profile_boundaries.sh \
            build/cmake-metal/native/release-link/volvoxai-lite \
            build/cmake-metal/native/release-link/volvoxai
          pkg_version=$(node -p 'require("./package.json").version')
          mkdir -p release-archives
          tar -czf "release-archives/volvoxai-${pkg_version}-${{ matrix.target }}.tar.gz" \
            -C build/cmake-metal/native/release-link volvoxai volvoxai-lite

      - name: Upload native archive for GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: volvoxai-archive-native-${{ matrix.target }}
          path: release-archives/volvoxai-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  build-wheel:
    name: Package Python wheel (manylinux_2_28_x86_64)
    needs: [preflight]
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Free runner disk space for manylinux wheel container
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build pinned manylinux wheel container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: python/Dockerfile.wheel
          push: false
          load: true
          tags: volvoxai-wheel-build:ci
          cache-from: type=gha,scope=volvoxai-wheel-build
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,mode=max,scope=volvoxai-wheel-build' || '' }}
      - name: Build and qualify Linux Python wheel
        run: |
          set -euo pipefail
          pkg_version=$(node -p 'require("./package.json").version')
          mkdir -p dist/python
          image_id=$(docker image inspect --format '{{.Id}}' volvoxai-wheel-build:ci)
          image_key=$(docker image inspect --format '{{json .RootFS.Layers}} {{json .Config.Env}} {{json .Config.Cmd}} {{json .Config.Entrypoint}}' volvoxai-wheel-build:ci | sha256sum | cut -d ' ' -f 1)
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e VOLVOXAI_WHEEL_IMAGE_ID="${image_id}" \
            -e VOLVOXAI_WHEEL_IMAGE_KEY="${image_key}" \
            -v "$PWD:/workspace:ro" \
            -v "$PWD/dist/python:/out" \
            volvoxai-wheel-build:ci \
            python python/build_wheel.py --out /out --jobs 2
          docker run --rm --platform linux/amd64 \
            -v "$PWD/dist/python/${pkg_version}:/dist:ro" -w /dist \
            volvoxai-wheel-build:ci \
            sh -c 'sha256sum --check SHA256SUMS && python -m twine check --strict *.whl'
          expected_wheel="dist/python/${pkg_version}/volvoxai-${pkg_version}-cp310-abi3-manylinux_2_28_x86_64.whl"
          if [ ! -f "${expected_wheel}" ]; then
            echo "::error::Missing expected wheel: ${expected_wheel}"
            exit 1
          fi
          mkdir -p release-archives
          cp "${expected_wheel}" release-archives/
      - name: Upload Python wheel for GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: volvoxai-archive-wheel
          path: release-archives/volvoxai-*-cp310-abi3-manylinux_2_28_x86_64.whl
          if-no-files-found: error

  publish-nightly:
    name: Publish rolling nightly pre-release
    needs: [preflight, test-javascript, test-native, test-cuda, build-web, build-native, build-wheel]
    concurrency:
      group: ${{ github.workflow }}-release-nightly
      cancel-in-progress: false
    if: >-
      !cancelled() &&
      github.repository == 'ivere27/volvoxai' &&
      needs.test-javascript.result == 'success' &&
      needs.test-native.result == 'success' &&
      needs.build-web.result == 'success' &&
      needs.build-native.result == 'success' &&
      needs.build-wheel.result == 'success' &&
      (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') &&
      (needs.test-cuda.result == 'success' || needs.test-cuda.result == 'skipped') && (
        (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
        (github.event_name == 'workflow_dispatch' && inputs.release_nightly == true && github.ref == 'refs/heads/master')
      )
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
          pattern: volvoxai-archive-*
          path: release-dist
          merge-multiple: true
      - name: Verify archives and compute cryptographic checksums
        run: |
          set -euo pipefail
          pkg_version=$(node -p 'require("./package.json").version')
          cd release-dist
          expected_files=(
            "volvoxai-${pkg_version}-cp310-abi3-manylinux_2_28_x86_64.whl"
            "volvoxai-${pkg_version}-linux-x86_64.tar.gz"
            "volvoxai-${pkg_version}-macos-arm64.tar.gz"
            "volvoxai-${pkg_version}-web.tar.gz"
            "volvoxai-${pkg_version}.tgz"
            "volvoxai-lite-${pkg_version}.tgz"
          )
          for expected in "${expected_files[@]}"; do
            if [ ! -f "${expected}" ]; then
              echo "::error::Missing required nightly archive: ${expected}"
              exit 1
            fi
          done
          LC_ALL=C sha256sum "${expected_files[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update rolling nightly GitHub Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          nightly_tag="nightly"
          pkg_version=$(node -p 'require("./package.json").version')
          short_sha="${GITHUB_SHA:0:7}"
          title="VolvoxAI nightly (${short_sha})"
          notes=$(cat <<EOF
          Rolling nightly pre-release built from \`master\` (${GITHUB_SHA}).

          - Version: \`${pkg_version}-nightly\` (\`${short_sha}\`)
          - Workflow run: ${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )

          find_nightly_releases() {
            gh api "repos/${GH_REPO}/releases" --paginate \
              --jq '.[] | select(.tag_name == "nightly")' | node -e '
              const fs = require("node:fs");
              const lines = fs.readFileSync(0, "utf8").split(/\r?\n/).filter(Boolean);
              process.stdout.write(JSON.stringify(lines.map(line => JSON.parse(line))));
            '
          }

          verify_nightly_release() {
            local expect_draft="$1"
            local releases_json
            releases_json=$(find_nightly_releases)
            node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const releases = JSON.parse(process.argv[1]);
              const expectDraft = process.argv[2] === "true";
              if (releases.length !== 1) {
                throw new Error(`Expected 1 nightly release, found ${releases.length}.`);
              }
              const rel = releases[0];
              if (rel.prerelease !== true) {
                throw new Error("Nightly release must have prerelease=true.");
              }
              if (rel.draft !== expectDraft) {
                throw new Error(`Expected nightly release draft=${expectDraft}, got ${rel.draft}.`);
              }
              const expectedFiles = fs.readdirSync("release-dist").sort();
              const actualAssets = new Map((rel.assets ?? []).map(a => [a.name, a.size]));
              const actualNames = [...actualAssets.keys()].sort();
              if (JSON.stringify(actualNames) !== JSON.stringify(expectedFiles)) {
                throw new Error(`Nightly assets mismatch: actual=${actualNames.join(", ")} expected=${expectedFiles.join(", ")}`);
              }
              for (const name of expectedFiles) {
                const localSize = fs.statSync(path.join("release-dist", name)).size;
                if (actualAssets.get(name) !== localSize) {
                  throw new Error(`Nightly asset size mismatch for ${name}: remote=${actualAssets.get(name)} local=${localSize}`);
                }
              }
            ' "${releases_json}" "${expect_draft}"
          }

          update_nightly_git_ref() {
            local has_exact
            has_exact=$(gh api "repos/${GH_REPO}/git/matching-refs/tags/${nightly_tag}" \
              --jq '[.[] | select(.ref == "refs/tags/nightly")] | length')
            if [ "${has_exact}" -gt 0 ]; then
              gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/${nightly_tag}" \
                -f "sha=${GITHUB_SHA}" \
                -F force=true >/dev/null
            else
              gh api --method POST "repos/${GH_REPO}/git/refs" \
                -f "ref=refs/tags/${nightly_tag}" \
                -f "sha=${GITHUB_SHA}" >/dev/null
            fi
          }

          existing_json=$(find_nightly_releases)
          existing_state=$(node -e '
            const releases = JSON.parse(process.argv[1]);
            if (releases.length === 0) { console.log("none"); process.exit(0); }
            if (releases.length > 1) { console.log("multiple"); process.exit(0); }
            const rel = releases[0];
            if (rel.prerelease !== true) { console.log("non-prerelease"); process.exit(0); }
            console.log(rel.draft ? "draft" : "published");
          ' "${existing_json}")

          case "${existing_state}" in
            multiple)
              echo "::error::Multiple releases with tag '${nightly_tag}' exist. Refusing to update."
              exit 1
              ;;
            non-prerelease)
              echo "::error::Release '${nightly_tag}' exists and is not a pre-release. Refusing to overwrite."
              exit 1
              ;;
            published|draft)
              gh release upload "${nightly_tag}" release-dist/* --clobber
              while IFS= read -r asset; do
                [ -n "${asset}" ] || continue
                if [ ! -f "release-dist/${asset}" ]; then
                  gh release delete-asset "${nightly_tag}" "${asset}" --yes
                fi
              done < <(printf '%s' "${existing_json}" | node -e '
                const rel = JSON.parse(require("node:fs").readFileSync(0, "utf8"))[0];
                for (const a of rel.assets ?? []) console.log(a.name);
              ')
              verify_nightly_release "$([ "${existing_state}" = "draft" ] && echo true || echo false)"
              update_nightly_git_ref
              gh release edit "${nightly_tag}" \
                --draft=false \
                --prerelease \
                --latest=false \
                --target "${GITHUB_SHA}" \
                --title "${title}" \
                --notes "${notes}"
              ;;
            none)
              gh release create "${nightly_tag}" release-dist/* \
                --target "${GITHUB_SHA}" \
                --draft \
                --prerelease \
                --latest=false \
                --title "${title}" \
                --notes "${notes}"
              verify_nightly_release true
              update_nightly_git_ref
              gh release edit "${nightly_tag}" \
                --draft=false \
                --prerelease \
                --latest=false
              ;;
          esac

  prepare-release:
    name: Assemble draft GitHub Release
    needs: [preflight, test-javascript, test-native, test-cuda, build-web, build-native, build-wheel]
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref }}
      cancel-in-progress: false
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
          pattern: volvoxai-archive-*
          path: release-dist
          merge-multiple: true
      - name: Verify archives and compute cryptographic checksums
        run: |
          set -euo pipefail
          pkg_version=$(node -p 'require("./package.json").version')
          cd release-dist
          expected_files=(
            "volvoxai-${pkg_version}-cp310-abi3-manylinux_2_28_x86_64.whl"
            "volvoxai-${pkg_version}-linux-x86_64.tar.gz"
            "volvoxai-${pkg_version}-macos-arm64.tar.gz"
            "volvoxai-${pkg_version}-web.tar.gz"
            "volvoxai-${pkg_version}.tgz"
            "volvoxai-lite-${pkg_version}.tgz"
          )
          for expected in "${expected_files[@]}"; do
            if [ ! -f "${expected}" ]; then
              echo "::error::Missing required release archive: ${expected}"
              exit 1
            fi
          done
          LC_ALL=C sha256sum "${expected_files[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update Draft GitHub Release and verify assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          is_draft=$(gh release view "${GITHUB_REF_NAME}" --json isDraft -q .isDraft 2>/dev/null || echo "missing")
          if [ "$is_draft" = "true" ]; then
            echo "Draft release ${GITHUB_REF_NAME} already exists; updating assets with clobber..."
            gh release upload "${GITHUB_REF_NAME}" release-dist/* --clobber
            while IFS= read -r asset; do
              [ -n "${asset}" ] || continue
              if [ ! -f "release-dist/${asset}" ]; then
                gh release delete-asset "${GITHUB_REF_NAME}" "${asset}" --yes
              fi
            done < <(gh release view "${GITHUB_REF_NAME}" --json assets -q '.assets[].name')
          elif [ "$is_draft" = "false" ]; then
            echo "::error::Release ${GITHUB_REF_NAME} is already published. Refusing to overwrite assets."
            exit 1
          else
            prerelease_opts=()
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              prerelease_opts+=(--prerelease --latest=false)
            fi
            gh release create "${GITHUB_REF_NAME}" release-dist/* \
              --draft "${prerelease_opts[@]}" \
              --title "VolvoxAI ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

          release_json=$(gh api "repos/${GH_REPO}/releases" --paginate --jq '.[]' | node -e '
            const fs = require("node:fs");
            const tag = process.argv[1];
            const lines = fs.readFileSync(0, "utf8").split(/\r?\n/).filter(Boolean);
            process.stdout.write(JSON.stringify(lines.map(line => JSON.parse(line)).filter(rel => rel.tag_name === tag)));
          ' "${GITHUB_REF_NAME}")
          node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const path = require("node:path");
            const releases = JSON.parse(process.argv[1]);
            if (releases.length !== 1 || releases[0].draft !== true) {
              throw new Error(`Expected one draft release, found ${releases.length}.`);
            }
            const expectedFiles = fs.readdirSync("release-dist").sort();
            const actualAssets = new Map((releases[0].assets ?? []).map(a => [a.name, a]));
            const actualNames = [...actualAssets.keys()].sort();
            if (JSON.stringify(actualNames) !== JSON.stringify(expectedFiles)) {
              throw new Error(`Draft release assets mismatch: actual=${actualNames.join(", ")} expected=${expectedFiles.join(", ")}`);
            }
            for (const name of expectedFiles) {
              const bytes = fs.readFileSync(path.join("release-dist", name));
              const meta = actualAssets.get(name);
              const digest = "sha256:" + crypto.createHash("sha256").update(bytes).digest("hex");
              if (meta.size !== bytes.byteLength) {
                throw new Error(`Size mismatch for ${name}: remote=${meta.size} local=${bytes.byteLength}`);
              }
              if (meta.digest && meta.digest !== digest) {
                throw new Error(`Digest mismatch for ${name}: remote=${meta.digest} local=${digest}`);
              }
            }
          ' "${release_json}"

  finalize-release:
    name: Finalize and publish GitHub Release
    needs: [prepare-release]
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref }}
      cancel-in-progress: false
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          edit_opts=(--draft=false)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            edit_opts+=(--prerelease --latest=false)
          fi
          gh release edit "${GITHUB_REF_NAME}" "${edit_opts[@]}"
