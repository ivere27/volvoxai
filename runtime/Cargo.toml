[package]
name = "volvoxai-runtime"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Synurang service wrapper over the VolvoxAI C inference engine (single cdylib)."

[lib]
name = "volvoxai"
# One platform cdylib (`libvolvoxai.so`/`libvolvoxai.dylib`) — the Synurang
# plugin. rlib so it can also be linked/tested from Rust.
crate-type = ["cdylib", "rlib"]

[dependencies]
prost = "0.12"
ctor = "0.2"           # self-register the plugin on library load
serde_json = "1"

[build-dependencies]
prost-build = "0.12"
cc = "1"               # compiles the native runtime sources into the cdylib
