[package]
name = "volvoxai-runtime"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "In-process Synurang FFI over the VolvoxAI full native lifecycle."

[lib]
name = "volvoxai"
# One platform cdylib (`libvolvoxai.so`/`libvolvoxai.dylib`) — the Synurang
# plugin. rlib so it can also be linked/tested from Rust.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Opt-in CUDA full-profile composition. The build script compiles the
# authoritative forward and training .cu sources to embedded PTX; the native
# backend loads only the NVIDIA Driver API at runtime.
cuda = []

[dependencies]
prost = "0.12"
ctor = "0.2"           # self-register the plugin on library load
serde_json = "1"

[build-dependencies]
prost-build = "0.12"
cc = "1"               # compiles the native runtime sources into the cdylib
