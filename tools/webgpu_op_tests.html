<script type="module">
// End-to-end per-op correctness test for the WebGPU (Tier 2) executor. Each op is
// run through the REAL GraphExecutor on WebGPU and compared against the pure-JS
// CPUEngine reference. Prints one PASS/FAIL line per op plus a final summary.
import { VolvoxAI, CPUEngine, Graph } from '../dist/0.2.0/volvoxai.js';

const out = document.getElementById('out');
const log = (s) => { out.textContent += s + '\n'; };

function buildGraph(spec) {
  if (spec.buildGraph) return spec.buildGraph();
  const g = new Graph();
  for (const inp of (spec.inputs || [])) g.addInput(inp.name, inp.shape, inp.dtype || 'float32');
  for (const w of (spec.weights || [])) { const t = g.addWeight(w.name, w.shape, w.dtype || 'float32'); t.buffer = w.data; }
  const inMap = {};
  for (const [k, v] of Object.entries(spec.opInputs)) inMap[k] = g.tensors.get(v);
  const out = spec.outDtype ? { shape: spec.outShape, dtype: spec.outDtype } : spec.outShape;
  const outs = g.addOp(spec.opType, inMap, { out }, spec.params || {});
  g.outputNames = [outs.out.name];
  return g;
}

function maxAbsDiff(a, b) {
  if (a.length !== b.length) return Infinity;
  let m = 0;
  for (let i = 0; i < a.length; i++) m = Math.max(m, Math.abs(a[i] - b[i]));
  return m;
}

async function readTypedOutput(exec, gpuBuffer, tensor) {
  // GraphExecutor.readBuffer currently exposes an F32 view for validation.
  // Read an aligned GPU range, then reinterpret its copied bytes according to
  // the graph-declared output dtype so integer parity cases are meaningful.
  const alignedBytes = Math.ceil(tensor.sizeBytes / 4) * 4;
  const raw = await exec.readBuffer(gpuBuffer, alignedBytes);
  const bytes = raw.buffer.slice(raw.byteOffset, raw.byteOffset + tensor.sizeBytes);
  switch (tensor.dtype) {
    case 'float32': return new Float32Array(bytes);
    case 'int32': return new Int32Array(bytes);
    case 'int8': return new Int8Array(bytes);
    case 'uint8': return new Uint8Array(bytes);
    default: throw new Error(`unsupported output dtype '${tensor.dtype}'`);
  }
}

async function runCase(engine, spec) {
  // Reference on CPU
  const cpu = new CPUEngine();
  const gc = buildGraph(spec);
  cpu.allocateGraph(gc);
  const rc = await cpu.execute(gc, spec.inputData || {});
  const expected = spec.expected || Array.from(rc[gc.outputNames[0]]);

  // WebGPU
  const gg = buildGraph(spec);
  const exec = await engine.compile(gg);
  const outBuf = await exec.execute(spec.inputData || {});
  const outputTensor = gg.getTensor(gg.outputNames[0]);
  const got = Array.from(await readTypedOutput(exec, outBuf, outputTensor));

  const diff = maxAbsDiff(expected, got);
  const ok = diff < 1e-3;
  log(`${ok ? 'PASS' : 'FAIL'}  ${spec.name.padEnd(18)} maxdiff=${diff.toExponential(2)}` +
      (ok ? '' : `\n   expected ${JSON.stringify(expected.slice(0, 8))}\n   got      ${JSON.stringify(got.slice(0, 8))}`));
  return ok;
}

// Exercise the training shader itself in SwiftShader. The forward graph cases
// below catch value conversion, while this verifies that d(scale) retains the
// exact I32 delta before F32 conversion: (16,777,217 - 16,777,216) +
// (16,777,218 - 16,777,216) = 3 for both typed zero-point representations.
async function runI32DequantScaleBackwardCase(device, zeroPointValues, zeroPointType, label) {
  device.pushErrorScope('validation');
  const source = await (await fetch('../shaders/training/dequantizeLinearBackward.wgsl')).text();
  const module = device.createShaderModule({ code: source });
  const pipeline = await device.createComputePipelineAsync({
    layout: 'auto', compute: { module, entryPoint: 'scale_main' },
  });
  const buffers = [];
  const upload = (values, extraUsage = 0) => {
    const buffer = device.createBuffer({
      size: Math.max(4, Math.ceil(values.byteLength / 4) * 4),
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | extraUsage,
    });
    device.queue.writeBuffer(buffer, 0, values.buffer, values.byteOffset, values.byteLength);
    buffers.push(buffer);
    return buffer;
  };
  const input = upload(Int32Array.of(16_777_217, 16_777_218));
  const zeroPoint = upload(zeroPointValues);
  const gradOutput = upload(Float32Array.of(1, 1));
  const gradScale = upload(Float32Array.of(0), GPUBufferUsage.COPY_SRC);
  const params = device.createBuffer({
    size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });
  device.queue.writeBuffer(params, 0, Uint32Array.of(2, 1, zeroPointType, 1));
  buffers.push(params);
  const readback = device.createBuffer({ size: 4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  buffers.push(readback);

  const bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: input } },
      { binding: 1, resource: { buffer: zeroPoint } },
      { binding: 3, resource: { buffer: gradOutput } },
      { binding: 5, resource: { buffer: gradScale } },
      { binding: 6, resource: { buffer: params } },
    ],
  });
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginComputePass();
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, bindGroup);
  pass.dispatchWorkgroups(1);
  pass.end();
  encoder.copyBufferToBuffer(gradScale, 0, readback, 0, 4);
  device.queue.submit([encoder.finish()]);
  await readback.mapAsync(GPUMapMode.READ);
  const actual = new Float32Array(readback.getMappedRange().slice(0))[0];
  readback.unmap();
  const validationError = await device.popErrorScope();
  for (const buffer of buffers) buffer.destroy();
  if (validationError) throw new Error(validationError.message);
  const expected = 3;
  const ok = Math.abs(actual - expected) < 1e-6;
  log(`${ok ? 'PASS' : 'FAIL'}  ${label.padEnd(18)} value=${actual}` +
      (ok ? '' : ` expected=${expected}`));
  return ok;
}

const ramp = (n, f = 1) => Float32Array.from({ length: n }, (_, i) => (i % 9 - 4) * f);
// These are finite F32 values below the former WGSL -1e38 maximum sentinel.
// Keeping both values equal also makes the profile mean exactly representable.
const extremeNegativePair = Float32Array.of(-1.1e38, -1.1e38);

function buildMoEGraph() {
  const g = new Graph();
  const input = g.addInput('x', [2, 2]);
  const routerWeight = g.addWeight('router_weight', [2, 3]);
  const routerBias = g.addWeight('router_bias', [3]);
  const expertWeight = g.addWeight('expert_weight', [3, 2, 2]);
  const expertBias = g.addWeight('expert_bias', [3, 2]);
  routerWeight.buffer = Float32Array.from([0.7, -0.4, 0.2, -0.3, 0.8, 0.5]);
  routerBias.buffer = Float32Array.from([0.1, -0.2, 0.05]);
  expertWeight.buffer = Float32Array.from([
    0.3, -0.1, 0.2, 0.4,
    -0.2, 0.5, 0.6, -0.3,
    0.4, 0.2, -0.5, 0.1,
  ]);
  expertBias.buffer = Float32Array.from([0.05, -0.1, -0.2, 0.3, 0.1, 0.2]);
  const routes = g.addOp('MoERouter', { input, weight: routerWeight, bias: routerBias }, {
    indices: { name: 'route_indices', shape: [2, 2] },
    weights: { name: 'route_weights', shape: [2, 2] },
  }, { num_experts: 3, top_k: 2, normalize: true, temperature: 1 });
  const { out } = g.addOp('MoELinear', {
    input,
    expert_weight: expertWeight,
    expert_bias: expertBias,
    route_indices: routes.indices,
    route_weights: routes.weights,
  }, { out: { name: 'moe_out', shape: [2, 2] } });
  g.outputNames = [out.name];
  return g;
}

function buildW8A8LinearGraph() {
  const g = new Graph();
  const input = g.addInput('x', [3, 19], 'uint8', {
    quantization: { scheme: 'per_tensor', scale: 0.02, zero_point: 127 },
  });
  const weightValues = Int8Array.from({ length: 36 * 19 }, (_, index) => (index * 29) % 31 - 15);
  const weight = g.addWeight('w', [36, 19], 'int8', {
    buffer: weightValues,
    quantization: {
      scheme: 'per_axis', axis: 0,
      scales: Array.from({ length: 36 }, (_, channel) => 0.0125 + (channel % 5) * 0.001),
      zero_points: Array.from({ length: 36 }, (_, channel) => channel % 7 - 3),
    },
  });
  const bias = g.addWeight('b', [36], 'int32', {
    buffer: Int32Array.from({ length: 36 }, (_, channel) => (channel % 9 - 4) * 13),
  });
  const { out } = g.addOp('QLinear', { input, weight, bias }, {
    out: {
      name: 'out', shape: [3, 36], dtype: 'int8',
      quantization: { scheme: 'per_tensor', scale: 0.05, zero_point: -3 },
    },
  });
  g.outputNames = [out.name];
  return g;
}

function buildW8A8ConvGraph() {
  const g = new Graph();
  const input = g.addInput('x', [1, 4, 5, 16], 'uint8', {
    quantization: { scheme: 'per_tensor', scale: 0.02, zero_point: 127 },
  });
  const weight = g.addWeight('w', [16, 3, 3, 16], 'int8', {
    buffer: Int8Array.from({ length: 16 * 3 * 3 * 16 }, (_, index) => (index * 11) % 15 - 7),
    quantization: {
      scheme: 'per_axis', axis: 0,
      scales: Array.from({ length: 16 }, (_, channel) => 0.015 + (channel % 4) * 0.001),
      zero_points: Array(16).fill(0),
    },
  });
  const bias = g.addWeight('b', [16], 'int32', {
    buffer: Int32Array.from({ length: 16 }, (_, channel) => (channel % 7 - 3) * 17),
  });
  const { out } = g.addOp('QConv2D', { input, weight, bias }, {
    out: {
      name: 'out', shape: [1, 4, 5, 16], dtype: 'int8',
      quantization: { scheme: 'per_tensor', scale: 0.1, zero_point: 0 },
    },
  }, {
    data_layout: 'NHWC', weight_layout: 'OHWI', stride: [1, 1],
    padding: [1, 1], dilation: [1, 1], groups: 1, relu: 0,
  });
  g.outputNames = [out.name];
  return g;
}

function buildW8A8ConvTailGraph(inputChannels) {
  const g = new Graph();
  const input = g.addInput('x', [1, 3, 5, inputChannels], 'uint8', {
    quantization: { scheme: 'per_tensor', scale: 0.02, zero_point: 131 },
  });
  const weightZeroPoints = Array.from({ length: 16 }, (_, channel) => channel % 7 - 3);
  const weight = g.addWeight('w', [16, 1, 1, inputChannels], 'int8', {
    buffer: Int8Array.from({ length: 16 * inputChannels }, (_, index) => {
      const channel = Math.floor(index / inputChannels);
      return weightZeroPoints[channel] + (index * 11) % 17 - 8;
    }),
    quantization: {
      scheme: 'per_axis', axis: 0,
      scales: Array.from({ length: 16 }, (_, channel) => 0.015 + (channel % 4) * 0.001),
      zero_points: weightZeroPoints,
    },
  });
  const bias = g.addWeight('b', [16], 'int32', {
    buffer: Int32Array.from({ length: 16 }, (_, channel) => (channel % 9 - 4) * 19),
  });
  const { out } = g.addOp('QConv2D', { input, weight, bias }, {
    out: {
      name: 'out', shape: [1, 3, 5, 16], dtype: 'uint8',
      quantization: { scheme: 'per_tensor', scale: 0.04, zero_point: 113 },
    },
  }, {
    data_layout: 'NHWC', weight_layout: 'OHWI', stride: [1, 1],
    padding: [0, 0], dilation: [1, 1], groups: 1, relu: 0,
  });
  g.outputNames = [out.name];
  return g;
}
