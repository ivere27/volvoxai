<!doctype html>
<html>
<head><meta charset="utf-8"><title>VolvoxAI WebGPU runtime baseline</title></head>
<body>
<pre id="out">RUNNING…</pre>
<script type="module">
import {
  Model,
  VolvoxAI,
  parseGraphDocument,
} from '../dist/0.4.0/volvoxai.js';

const SCHEMA = 'volvoxai.webgpu-runtime-baseline/v2';
const out = document.getElementById('out');

function integerParameter(name, fallback, minimum, maximum) {
  const raw = new URL(location.href).searchParams.get(name);
  const value = raw == null ? fallback : Number(raw);
  if (!Number.isSafeInteger(value) || value < minimum || value > maximum) {
    throw new Error(`${name} must be an integer from ${minimum} through ${maximum}`);
  }
  return value;
}

function percentile(values, fraction) {
  const ordered = [...values].sort((left, right) => left - right);
  return ordered[Math.max(0, Math.ceil(fraction * ordered.length) - 1)];
}

function variance(values) {
  const mean = values.reduce((total, value) => total + value, 0) / values.length;
  return values.reduce((total, value) => total + (value - mean) ** 2, 0) / values.length;
}

function summarize(values) {
  return Object.freeze({
    samples: values.length,
    p50Ms: percentile(values, 0.50),
    p95Ms: percentile(values, 0.95),
    varianceMs2: variance(values),
    minimumMs: Math.min(...values),
    maximumMs: Math.max(...values),
  });
}

function byteDigest(value) {
  const bytes = new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
  let digest = 0x811c9dc5;
  for (const byte of bytes) {
    digest ^= byte;
    digest = Math.imul(digest, 0x01000193) >>> 0;
  }
  return digest;
}

function sameBytes(left, right) {
  if (!ArrayBuffer.isView(left) || !ArrayBuffer.isView(right) ||
      left.byteLength !== right.byteLength) return false;
  const a = new Uint8Array(left.buffer, left.byteOffset, left.byteLength);
  const b = new Uint8Array(right.buffer, right.byteOffset, right.byteLength);
  for (let index = 0; index < a.length; index++) {
    if (a[index] !== b[index]) return false;
  }
  return true;
}

function maximumAbsoluteError(left, right) {
  if (left.length !== right.length) return null;
  let maximum = 0;
  for (let index = 0; index < left.length; index++) {
    maximum = Math.max(maximum, Math.abs(left[index] - right[index]));
  }
  return maximum;
}

function deterministic(length, salt) {
  return Float32Array.from({ length }, (_, index) =>
    Math.fround((((index * 37 + salt * 17) % 257) - 128) / 257));
}

function plainAdapterInfo(adapter) {
  const info = adapter?.info;
  const result = {};
  for (const field of [
    'vendor', 'architecture', 'device', 'description', 'backend',
    'deviceType', 'driver',
  ]) {
    if (typeof info?.[field] === 'string' && info[field]) result[field] = info[field];
  }
  return result;
}

function selectedLimits(adapter) {
  const result = {};
  for (const name of [
    'maxBufferSize', 'maxStorageBufferBindingSize',
    'maxComputeWorkgroupsPerDimension', 'maxComputeInvocationsPerWorkgroup',
  ]) {
    const value = adapter?.limits?.[name];
    if (typeof value === 'number') result[name] = value;
  }
  return result;
}

function installResourceInstrumentation() {
  const counters = {
    buffersCreated: 0,
    buffersDestroyed: 0,
    bufferBytesCreated: 0,
    undestroyedBufferBytes: 0,
    requestedBufferBytesHighWater: 0,
    shaderModulesCreated: 0,
    computePipelinesCreated: 0,
    bindGroupsCreated: 0,
    commandEncodersCreated: 0,
    writeBufferCalls: 0,
    writeBufferBytesRequested: 0,
    lastWriteBuffer: null,
  };
  const bufferBytes = new WeakMap();
  const devices = new Set();
  const restorers = [];

  const replace = (prototype, name, replacement) => {
    const descriptor = Object.getOwnPropertyDescriptor(prototype, name);
    if (!descriptor || typeof descriptor.value !== 'function') {
      throw new Error(`cannot instrument WebGPU method ${name}`);
    }
    Object.defineProperty(prototype, name, { ...descriptor, value: replacement(descriptor.value) });
    restorers.push(() => Object.defineProperty(prototype, name, descriptor));
  };

  replace(GPUDevice.prototype, 'createBuffer', (original) => function instrumentedCreateBuffer(descriptor) {
    const buffer = original.call(this, descriptor);
    devices.add(this);
    const size = Number(descriptor.size);
    if (!Number.isSafeInteger(size) || size < 0) throw new Error('observed an invalid GPUBuffer size');
    bufferBytes.set(buffer, size);
    counters.buffersCreated++;
    counters.bufferBytesCreated += size;
    counters.undestroyedBufferBytes += size;
    counters.requestedBufferBytesHighWater = Math.max(
      counters.requestedBufferBytesHighWater,
      counters.undestroyedBufferBytes,
    );
    return buffer;
  });
  replace(GPUBuffer.prototype, 'destroy', (original) => function instrumentedDestroy() {
    const size = bufferBytes.get(this);
    if (size !== undefined) {
      bufferBytes.delete(this);
      counters.buffersDestroyed++;
      counters.undestroyedBufferBytes -= size;
    }
    return original.call(this);
  });
  for (const [name, counter] of [
    ['createShaderModule', 'shaderModulesCreated'],
    ['createComputePipeline', 'computePipelinesCreated'],
    ['createComputePipelineAsync', 'computePipelinesCreated'],
    ['createBindGroup', 'bindGroupsCreated'],
    ['createCommandEncoder', 'commandEncodersCreated'],
  ]) {
    replace(GPUDevice.prototype, name, (original) => function instrumentedFactory(...args) {
      counters[counter]++;
      return original.apply(this, args);
    });
  }
  replace(GPUQueue.prototype, 'writeBuffer', (original) => function instrumentedWriteBuffer(
    buffer, bufferOffset, data, dataOffset, size,
  ) {
    const unitBytes = ArrayBuffer.isView(data) && !(data instanceof DataView)
      ? data.BYTES_PER_ELEMENT
      : 1;
    const availableBytes = ArrayBuffer.isView(data) ? data.byteLength : data.byteLength;
    const offsetBytes = (dataOffset ?? 0) * unitBytes;
    const requestedBytes = size == null ? availableBytes - offsetBytes : size * unitBytes;
    const observation = {
      bufferOffset,
      dataType: data?.constructor?.name ?? typeof data,
      availableBytes,
      dataOffset: dataOffset ?? 0,
      size: size ?? null,
      requestedBytes,
    };
    counters.writeBufferCalls++;
    counters.writeBufferBytesRequested += requestedBytes;
    counters.lastWriteBuffer = observation;
    try {
      return original.call(this, buffer, bufferOffset, data, dataOffset, size);
    } catch (error) {
      throw new Error(`${error?.message || error}; writeBuffer=${JSON.stringify(observation)}`);
    }
  });

  return Object.freeze({
    snapshot() { return Object.freeze({ ...counters }); },
    async waitForSubmittedWork() {
      await Promise.all([...devices].map((device) => device.queue.onSubmittedWorkDone()));
    },
    restore() {
      for (const restore of restorers.reverse()) restore();
    },
  });
}

function capture(document) {
  const graph = parseGraphDocument(document, []);
  return Model.capture({ graph, weights: {} });
}

function identitySnapshot(width) {
  return capture({
    format: 'volvox-graph/v1',
    dimensions: {},
    inputs: { x: { dtype: 'float32', shape: [1, width] } },
    nodes: [{
      id: 'identity', opType: 'Identity', inputs: { input: 'x' },
      outputs: { out: { tensor: 'y', dtype: 'float32', shape: [1, width] } },
      params: {},
    }],
    outputs: ['y'],
  });
}

function reluSnapshot(length, maximum = null) {
  const dynamic = maximum !== null;
  const sequence = dynamic ? 'S' : length;
  return capture({
    format: 'volvox-graph/v1',
    dimensions: dynamic ? { S: { min: 1, max: maximum } } : {},
    inputs: { x: { dtype: 'float32', shape: [1, sequence] } },
    nodes: [{
      id: 'relu', opType: 'ReLU', inputs: { input: 'x' },
      outputs: { out: { tensor: 'y', dtype: 'float32', shape: [1, sequence] } },
      params: {},
    }],
    outputs: ['y'],
  });
}

function shaped(data, length) {
  return Object.freeze({ x: Object.freeze({ data, shape: Object.freeze([1, length]) }) });
}

function browserMemory() {
  const memory = performance.memory;
  return memory ? {
    usedJSHeapSize: memory.usedJSHeapSize,
    totalJSHeapSize: memory.totalJSHeapSize,
    jsHeapSizeLimit: memory.jsHeapSizeLimit,
  } : null;
}

async function compile(runtime, snapshot) {
  const started = performance.now();
  const compiled = await runtime.compile(snapshot, {
    backend: { mode: 'require', backend: 'webgpu', operatorFallback: 'forbid' },
  });
  return Object.freeze({
    compiled,
    wallTimeMs: performance.now() - started,
    report: compiled.report,
  });
}

async function execute(context, inputs, instrumentation, { read = false } = {}) {
  const started = performance.now();
  const result = await context.execute(inputs);
  await instrumentation.waitForSubmittedWork();
  const report = result.report;
  const output = read ? await result.output('y').read() : null;
  await result.close();
  return Object.freeze({
    wallTimeMs: performance.now() - started,
    report,
    output,
  });
}

function telemetry(report) {
  const backend = report?.backendReport ?? {};
  return Object.freeze({
    shapeSignature: report?.shapeSignature ?? null,
    shapeBindTimeMs: report?.shapeBindTimeMs ?? null,
    providerTimeMs: report?.providerTimeMs ?? null,
    executionTimeMs: report?.executionTimeMs ?? null,
    specializationCacheHit: backend.specializationCacheHit ?? null,
    specializationCacheEntries: backend.specializationCacheEntries ?? null,
    specializationCacheMetadataBytes: backend.specializationCacheMetadataBytes ?? null,
    specializationCacheHits: backend.specializationCacheHits ?? null,
    specializationCacheMisses: backend.specializationCacheMisses ?? null,
    specializationCacheEvictions: backend.specializationCacheEvictions ?? null,
    logicalActivationBytes: backend.logicalActivationBytes ?? null,
    activationCapacityBytes: backend.activationCapacityBytes ?? null,
    activationCapacityHighWaterBytes: backend.activationCapacityHighWaterBytes ?? null,
    activationGrowCount: backend.activationGrowCount ?? null,
    specializationRebindCount: backend.specializationRebindCount ?? null,
    specializationBufferCreateCount: backend.specializationBufferCreateCount ?? null,
    bindGroupCreateCount: backend.bindGroupCreateCount ?? null,
    bindGroupReuseCount: backend.bindGroupReuseCount ?? null,
    pendingRetiredBufferCount: backend.pendingRetiredBufferCount ?? null,
  });
}

async function measureConstant(runtime, instrumentation, width, warmup, samples) {
  const owner = await compile(runtime, identitySnapshot(width));
  const context = await owner.compiled.createContext();
  const input = deterministic(width, 1);
  try {
    const cold = await execute(context, shaped(input, width), instrumentation, { read: true });
    for (let index = 0; index < warmup; index++) {
      await execute(context, shaped(input, width), instrumentation);
    }
    const samplesMs = [];
    let finalReport = cold.report;
    for (let index = 0; index < samples; index++) {
      const observation = await execute(context, shaped(input, width), instrumentation);
      samplesMs.push(observation.wallTimeMs);
      finalReport = observation.report;
    }
    const second = await execute(context, shaped(input, width), instrumentation, { read: true });
    return Object.freeze({
      workload: Object.freeze({ operation: 'Identity', dtype: 'float32', shape: [1, width] }),
      compilation: Object.freeze({ wallTimeMs: owner.wallTimeMs, publicReport: owner.report }),
      cold: Object.freeze({ wallTimeMs: cold.wallTimeMs, telemetry: telemetry(cold.report) }),
      warm: summarize(samplesMs),
      finalTelemetry: telemetry(finalReport),
      snapshot: Object.freeze({
        outputBytes: cold.output.byteLength,
        expectedDigest: byteDigest(input),
        digest: byteDigest(cold.output),
        byteExactIdentity: sameBytes(cold.output, input),
        freshCallerOwnedReads: cold.output !== second.output &&
          cold.output.buffer !== second.output.buffer && sameBytes(cold.output, second.output),
      }),
    });
  } finally {
    await context.close();
    await owner.compiled.close();
  }
}

async function measureDynamic(runtime, instrumentation, active, maximum, warmup, samples) {
  const owners = await Promise.all([
    compile(runtime, reluSnapshot(active, maximum)),
    compile(runtime, reluSnapshot(active)),
    compile(runtime, reluSnapshot(maximum)),
  ]);
  const [dynamicOwner, activeOwner, paddedOwner] = owners;
  const contexts = await Promise.all(owners.map((owner) => owner.compiled.createContext()));
  const [dynamicContext, activeContext, paddedContext] = contexts;
  const activeData = deterministic(active, 2);
  const paddedData = new Float32Array(maximum);
  paddedData.set(activeData);
  for (let index = active; index < maximum; index++) paddedData[index] = (index & 1) ? -0.5 : 0.5;
  const activeInputs = shaped(activeData, active);
  const paddedInputs = shaped(paddedData, maximum);
  try {
    const resourcesBeforeCold = instrumentation.snapshot();
    const coldActive = await execute(dynamicContext, activeInputs, instrumentation, { read: true });
    const resourcesAfterColdActive = instrumentation.snapshot();
    const coldPadded = await execute(dynamicContext, paddedInputs, instrumentation, { read: true });
    const resourcesAfterColdPadded = instrumentation.snapshot();
    const staticActive = await execute(activeContext, activeInputs, instrumentation, { read: true });
    const staticPadded = await execute(paddedContext, paddedInputs, instrumentation, { read: true });
    const paddedPrefix = coldPadded.output.slice(0, active);
    const parity = Object.freeze({
      dynamicActiveMaximumAbsoluteError: maximumAbsoluteError(coldActive.output, staticActive.output),
      dynamicPaddedMaximumAbsoluteError: maximumAbsoluteError(coldPadded.output, staticPadded.output),
      paddedActiveRegionMaximumAbsoluteError: maximumAbsoluteError(paddedPrefix, staticActive.output),
    });
    if (Object.values(parity).some((error) => error === null || error !== 0)) {
      throw new Error(`dynamic WebGPU ReLU parity failed: ${JSON.stringify(parity)}`);
    }

    for (let index = 0; index < warmup; index++) {
      await execute(dynamicContext, activeInputs, instrumentation);
      await execute(activeContext, activeInputs, instrumentation);
      await execute(paddedContext, paddedInputs, instrumentation);
    }
    const warmDynamic = [];
    const warmStatic = [];
    const warmPadded = [];
    for (let index = 0; index < samples; index++) {
      warmDynamic.push((await execute(dynamicContext, activeInputs, instrumentation)).wallTimeMs);
      warmStatic.push((await execute(activeContext, activeInputs, instrumentation)).wallTimeMs);
      warmPadded.push((await execute(paddedContext, paddedInputs, instrumentation)).wallTimeMs);
    }
    const alternating = [];
    for (let index = 0; index < samples; index++) {
      alternating.push((await execute(
        dynamicContext,
        index % 2 === 0 ? activeInputs : paddedInputs,
        instrumentation,
      )).wallTimeMs);
    }
    const adversarialLengths = [1, 3, 7, 15, 31, 63, 127, 255, 511, 1023,
      Math.max(1, Math.floor(maximum / 3)), maximum];
    const uniqueAdversarialLengths = [...new Set(adversarialLengths
      .map((value) => Math.min(maximum, value)))];
    const adversarial = [];
    let finalReport = coldPadded.report;
    for (let index = 0; index < uniqueAdversarialLengths.length; index++) {
      const length = uniqueAdversarialLengths[index];
      const observation = await execute(
        dynamicContext,
        shaped(deterministic(length, 20 + index), length),
        instrumentation,
      );
      adversarial.push(observation.wallTimeMs);
      finalReport = observation.report;
    }
    const resourcesAfterCampaign = instrumentation.snapshot();
    return Object.freeze({
      workload: Object.freeze({
        operation: 'ReLU', dtype: 'float32',
        activeShape: [1, active], paddedMaximumShape: [1, maximum],
        activeInputBytes: activeData.byteLength, paddedInputBytes: paddedData.byteLength,
      }),
      compilation: Object.freeze({
        dynamicWallTimeMs: dynamicOwner.wallTimeMs,
        dynamicPublicReport: dynamicOwner.report,
        activeStaticWallTimeMs: activeOwner.wallTimeMs,
        paddedStaticWallTimeMs: paddedOwner.wallTimeMs,
      }),
      coldSpecialization: Object.freeze({
        active: Object.freeze({ wallTimeMs: coldActive.wallTimeMs, telemetry: telemetry(coldActive.report) }),
        padded: Object.freeze({ wallTimeMs: coldPadded.wallTimeMs, telemetry: telemetry(coldPadded.report) }),
      }),
      warm: Object.freeze({
        dynamicActive: summarize(warmDynamic),
        staticActive: summarize(warmStatic),
        paddedMaximum: summarize(warmPadded),
        paddedToDynamicP50Ratio: percentile(warmPadded, 0.50) / percentile(warmDynamic, 0.50),
      }),
      alternating: summarize(alternating),
      adversarial: Object.freeze({
        ...summarize(adversarial),
        lengths: Object.freeze(uniqueAdversarialLengths),
        finalTelemetry: telemetry(finalReport),
      }),
      parity,
      resources: Object.freeze({
        beforeCold: resourcesBeforeCold,
        afterColdActive: resourcesAfterColdActive,
        afterColdPadded: resourcesAfterColdPadded,
        afterCampaign: resourcesAfterCampaign,
      }),
    });
  } finally {
    await Promise.all(contexts.map((context) => context.close()));
    await Promise.all(owners.map((owner) => owner.compiled.close()));
  }
}

async function run() {
  if (!navigator.gpu) throw new Error('navigator.gpu is unavailable');
  const samples = integerParameter('samples', 31, 3, 1001);
  const warmup = integerParameter('warmup', 5, 0, 1000);
  const width = integerParameter('width', 65536, 1024, 16_777_216);
  const active = integerParameter('active', 8192, 1, width);
  if (active >= width) throw new Error('active must be smaller than width');
  const instrumentation = installResourceInstrumentation();
  let runtime;
  try {
    const resourcesBeforeRuntime = instrumentation.snapshot();
    runtime = await VolvoxAI.createRuntime({ backends: ['webgpu'] });
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error('no WebGPU adapter was selected');
    const resourcesAfterRuntime = instrumentation.snapshot();
    const constant = await measureConstant(runtime, instrumentation, width, warmup, samples);
    const resourcesAfterConstant = instrumentation.snapshot();
    const dynamic = await measureDynamic(runtime, instrumentation, active, width, warmup, samples);
    const resourcesBeforeClose = instrumentation.snapshot();
    await runtime.close();
    runtime = null;
    await instrumentation.waitForSubmittedWork();
    await new Promise((resolve) => setTimeout(resolve, 0));
    const resourcesAfterClose = instrumentation.snapshot();
    return Object.freeze({
      schema: SCHEMA,
      recordedAt: new Date().toISOString(),
      environment: Object.freeze({
        userAgent: navigator.userAgent,
        adapter: plainAdapterInfo(adapter),
        features: Object.freeze([...adapter.features].sort()),
        limits: selectedLimits(adapter),
        packedDot: navigator.gpu.wgslLanguageFeatures?.has('packed_4x8_integer_dot_product') === true,
      }),
      protocol: Object.freeze({
        warmupExecutions: warmup,
        measuredExecutions: samples,
        timing: 'public execute through GPUQueue.onSubmittedWorkDone and result close; caller readback only in parity samples',
        resourceSemantics: 'requested GPUBuffer bytes instrumented at API calls, not allocator-exact physical memory',
      }),
      constant,
      dynamic,
      resources: Object.freeze({
        beforeRuntime: resourcesBeforeRuntime,
        afterRuntime: resourcesAfterRuntime,
        afterConstant: resourcesAfterConstant,
        beforeClose: resourcesBeforeClose,
        afterClose: resourcesAfterClose,
        browserMemoryAfterClose: browserMemory(),
      }),
    });
  } finally {
    await runtime?.close();
    instrumentation.restore();
  }
}

(async () => {
  try {
    const evidence = await run();
    const constantPassed = evidence.constant.snapshot.byteExactIdentity &&
      evidence.constant.snapshot.freshCallerOwnedReads &&
      evidence.constant.compilation.publicReport?.selectedBackend === 'webgpu';
    const dynamicPassed = Object.values(evidence.dynamic.parity).every((error) => error === 0) &&
      evidence.dynamic.compilation.dynamicPublicReport?.selectedBackend === 'webgpu' &&
      evidence.dynamic.coldSpecialization.active.telemetry.specializationCacheHit === false &&
      evidence.dynamic.warm.dynamicActive.samples > 0;
    out.textContent = `SUMMARY ${constantPassed && dynamicPassed ? 'ALL_PASS' : 'FAILED'}\n${JSON.stringify(evidence, null, 2)}`;
  } catch (error) {
    out.textContent = `FATAL ${error?.message || error}\n${error?.stack || ''}`;
  }
})();
</script>
</body>
</html>
